apiVersion: apps.emqx.io/v2
kind: EMQX
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: emqx
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
  imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
  {{- if .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- include "common.tplvalues.render" (dict "value" .Values.imagePullSecrets "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.serviceAccountName }}
  serviceAccountName: {{ .Values.serviceAccountName | quote }}
  {{- end }}
  clusterDomain: {{ .Values.clusterDomain | quote }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- range .Values.bootstrapAPIKeys }}
  {{- if or .key .secret }}
  {{- fail "bootstrapAPIKeys must use secretRef.key and secretRef.secret, not plaintext key/secret" }}
  {{- end }}
  {{- $ref := required "bootstrapAPIKeys[].secretRef is required" .secretRef }}
  {{- $_ := required "bootstrapAPIKeys[].secretRef.key.secretName is required" (dig "key" "secretName" "" $ref) }}
  {{- $_ := required "bootstrapAPIKeys[].secretRef.key.secretKey is required" (dig "key" "secretKey" "" $ref) }}
  {{- $_ := required "bootstrapAPIKeys[].secretRef.secret.secretName is required" (dig "secret" "secretName" "" $ref) }}
  {{- $_ := required "bootstrapAPIKeys[].secretRef.secret.secretKey is required" (dig "secret" "secretKey" "" $ref) }}
  {{- end }}
  {{- if .Values.bootstrapAPIKeys }}
  bootstrapAPIKeys:
    {{- include "common.tplvalues.render" (dict "value" .Values.bootstrapAPIKeys "context" $) | nindent 4 }}
  {{- end }}
  config:
    mode: {{ .Values.config.mode | quote }}
    data: |
      {{- if .Values.config.data }}
      {{- tpl .Values.config.data $ | nindent 6 }}
      {{- else }}
      listeners.ws.default {
        websocket.mqtt_path = {{ .Values.global.emqx.mqtt.websocket.mqttPath | quote }}
      }
      listeners.wss.default {
        websocket.mqtt_path = {{ .Values.global.emqx.mqtt.secureWebsocket.mqttPath | quote }}
      }
      {{- end }}
      {{- if or .Values.mqtt.enabled .Values.mqtt.additionalAuthentication }}
      authentication = [
      {{- $separator := false }}
      {{- if .Values.mqtt.enabled }}
      {
        mechanism = password_based
        backend = built_in_database
        user_id_type = username
        password_hash_algorithm { name = sha256, salt_position = suffix }
        bootstrap_file = "/opt/emqx/mqtt-bootstrap/users.json"
        bootstrap_type = plain
      }
      {{- $separator = true }}
      {{- end }}
      {{- range .Values.mqtt.additionalAuthentication }}
      {{- if $separator }},{{ end }}
      {{ tpl (toJson .) $ }}
      {{- $separator = true }}
      {{- end }}
      ]
      {{- end }}
  {{- if .Values.updateStrategy }}
  updateStrategy:
    {{- include "common.tplvalues.render" (dict "value" .Values.updateStrategy "context" $) | nindent 4 }}
  {{- end }}
  coreTemplate:
    spec:
      replicas: {{ include "common.replicas" (dict "replicaCount" .Values.coreTemplate.replicaCount "global" .Values.global) }}
      {{- if ne (toString .Values.coreTemplate.minAvailable) "" }}
      minAvailable: {{ .Values.coreTemplate.minAvailable }}
      {{- end }}
      {{- if ne (toString .Values.coreTemplate.maxUnavailable) "" }}
      maxUnavailable: {{ .Values.coreTemplate.maxUnavailable }}
      {{- end }}
      {{- if .Values.coreTemplate.nodeSelector }}
      nodeSelector:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.coreTemplate.tolerations }}
      tolerations:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.coreTemplate.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.coreTemplate.resources }}
      resources:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.resources "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.coreTemplate.podSecurityContext }}
      podSecurityContext:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.coreTemplate.containerSecurityContext }}
      containerSecurityContext:
        {{- include "common.tplvalues.render" (dict "value" .Values.coreTemplate.containerSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- $bootstrap := dict }}
      {{- if .Values.mqtt.enabled }}
      {{- $bootstrap = include "emqx.mqttBootstrapSpec" . | fromYaml }}
      {{- end }}
      {{- range $key := list "extraVolumes" "extraVolumeMounts" "initContainers" }}
      {{- $items := concat (default list (index $bootstrap $key)) (default list (index $.Values.coreTemplate $key)) }}
      {{- if $items }}
      {{ $key }}:
        {{- include "common.tplvalues.render" (dict "value" $items "context" $) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.coreTemplate.persistence.enabled }}
      volumeClaimTemplates:
        {{- if hasKey .Values.coreTemplate.persistence "storageClass" }}
        {{- if ne .Values.coreTemplate.persistence.storageClass nil }}
        storageClassName: {{ .Values.coreTemplate.persistence.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.coreTemplate.persistence.size | quote }}
        accessModes:
          {{- toYaml .Values.coreTemplate.persistence.accessModes | nindent 10 }}
      {{- end }}
  {{- if .Values.replicantTemplate }}
  replicantTemplate:
    {{- include "emqx.replicantTemplate" . | nindent 4 }}
  {{- end }}
  {{- if .Values.dashboardServiceTemplate }}
  dashboardServiceTemplate:
    {{- include "common.tplvalues.render" (dict "value" .Values.dashboardServiceTemplate "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.listenersServiceTemplate }}
  listenersServiceTemplate:
    {{- include "common.tplvalues.render" (dict "value" .Values.listenersServiceTemplate "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.extraSpec }}
  {{- include "common.tplvalues.render" (dict "value" .Values.extraSpec "context" $) | nindent 2 }}
  {{- end }}
