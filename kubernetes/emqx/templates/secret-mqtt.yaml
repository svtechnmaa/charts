{{- if and .Values.mqtt.enabled (not .Values.mqtt.auth.existingSecret) }}
{{- $users := default dict .Values.global.authenUsers }}
{{- $mqtt := default dict $users.mqtt }}
{{- $localPassword := tpl (default "" .Values.mqtt.auth.password | toString) . }}
{{- $globalPassword := tpl (default "" $mqtt.password | toString) . }}
{{- $password := default $localPassword $globalPassword }}
{{- $passwordContext := merge (dict "Values" (deepCopy .Values)) . }}
{{- $_ := set $passwordContext.Values.mqtt.auth "password" $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "emqx.mqttSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
  {{ include "emqx.mqttSecretKey" . | quote }}: {{ include "common.secrets.passwords.manage" (dict "secret" (include "emqx.mqttSecretName" .) "key" (include "emqx.mqttSecretKey" .) "providedValues" (list "mqtt.auth.password") "length" 32 "context" $passwordContext) }}
{{- end }}
