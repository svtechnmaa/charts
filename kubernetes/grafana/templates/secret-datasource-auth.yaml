{{- $secureFiles := default (dict) .Values.cd.secureFiles }}
{{- if $secureFiles }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-datasource-auth
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource-auth
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $name, $config := $secureFiles }}
  {{- range $field, $value := $config }}
  {{ include "grafana.datasourceEnvName" (list $name $field) }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
