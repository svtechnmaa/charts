{{- $secureFiles := default (dict) .Values.gitsync.secureFiles }}
{{- if and .Values.gitsync.enabled $secureFiles }}
{{- $seen := dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-datasource-auth
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-datasource-auth
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $name, $config := $secureFiles }}
  {{- range $field, $value := $config }}
  {{- $key := include "grafana.datasourceEnvName" (list $name $field) }}
  {{- if hasKey $seen $key }}{{ fail (printf "gitsync.secureFiles has duplicate normalized key %s" $key) }}{{ end }}
  {{- $_ := set $seen $key true }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
