{{- if and (include "grafana.rendererTokenEnabled" .) (not .Values.renderer.existingSecret) }}
{{- $name := include "grafana.rendererTokenSecretName" . }}
{{- $key := .Values.renderer.existingSecretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := default dict $existing.data }}
{{- $token := "" }}
{{- if .Values.renderer.authToken }}
{{- $token = tpl (toString .Values.renderer.authToken) . | b64enc }}
{{- else if hasKey $data $key }}
{{- $token = index $data $key }}
{{- else }}
{{- $token = randAlphaNum 64 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}
