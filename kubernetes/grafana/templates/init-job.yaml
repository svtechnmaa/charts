apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-init
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-entities-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "20"
    argogitsync.argoproj.io/hook: PostSync
    argogitsync.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argogitsync.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: grafana-entities-init
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "common.names.fullname" . }}-cd
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
      # shareVolume(volume): define in the global values
        {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
        {{- range .Values.global.sharedPersistenceVolume }}
        {{- if has $.Chart.Name .shareFor }}
        - name: {{ .volumeName }}
          persistentVolumeClaim:
            claimName: {{ .pvcName }}
        {{- end }}
        {{- end }}
        {{- end }}
      # unshareVolume(volume): define in the chart's values.yaml
        {{- if .Values.volumes }}
        {{- tpl (toYaml .Values.volumes) $ | nindent 8 }}
        {{- end }}
        - name: grafana-entities
          emptyDir: {}
      initContainers:
        - name: grafana-entities
          image: duchieu2920/grafana-entities:v1.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GITSYNC_URL
              value: {{ required "gitsync.url is required for the grafana-entities push" .Values.gitsync.url | quote }}
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.managedAuthSecretName" . | quote }}
                  key: signer_name
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.managedAuthSecretName" . | quote }}
                  key: token
            - name: GIT_TERMINAL_PROMPT
              value: "0"
          volumeMounts:
            # shareVolume: VolumeMount
            {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
            {{- range .Values.global.sharedPersistenceVolume }}
            {{- if has $.Chart.Name .shareFor }}
            - name: {{ .volumeName }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
            {{- end }}
            # unshareVolume(volumeMount): define in the chart's values.yaml
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            - name: grafana-entities
              mountPath: /opt/grafana-entities
          command:
            - /bin/sh
            - -c
            - |
              set -Eeuo pipefail

              log() {
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
              }

              askpass_file="$(mktemp)"
              trap 'rm -f "$askpass_file"' EXIT
              cat > "$askpass_file" <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' "$GIT_USERNAME" ;;
                *Password*) printf '%s\n' "$GIT_TOKEN" ;;
              esac
              EOF
              chmod 700 "$askpass_file"
              export GIT_ASKPASS="$askpass_file"

              until git ls-remote "$GITSYNC_URL" >/dev/null 2>&1; do
                log "Waiting for Git repository ${GITSYNC_URL} to become available..."
                sleep 5
              done

              cd /tmp/grafana-entities

              remote_refs="$(
                git ls-remote --heads "$GITSYNC_URL" \
                  refs/heads/main \
                  refs/heads/upstream
              )"
              main_sha="$(
                printf '%s\n' "$remote_refs" |
                  awk '$2 == "refs/heads/main" { print $1; exit }'
              )"
              upstream_sha="$(
                printf '%s\n' "$remote_refs" |
                  awk '$2 == "refs/heads/upstream" { print $1; exit }'
              )"

              if [ -z "$main_sha" ] && [ -z "$upstream_sha" ]; then
                log "Git repository is empty; seeding main and upstream"
                if ! git push --atomic "$GITSYNC_URL" \
                  HEAD:refs/heads/main \
                  HEAD:refs/heads/upstream; then
                  log "Failed to seed Grafana entities repository"
                  exit 1
                fi
              elif [ -n "$main_sha" ] && [ -z "$upstream_sha" ]; then
                log "main already exists; creating missing upstream from main"
                git fetch --no-tags "$GITSYNC_URL" refs/heads/main
                git push "$GITSYNC_URL" FETCH_HEAD:refs/heads/upstream
              elif [ -z "$main_sha" ] && [ -n "$upstream_sha" ]; then
                log "upstream already exists; creating missing main from upstream"
                git fetch --no-tags "$GITSYNC_URL" refs/heads/upstream
                git push "$GITSYNC_URL" FETCH_HEAD:refs/heads/main
              else
                log "main and upstream already exist; skipping repository seed"
              fi

              log "Grafana entities repository is ready"
              log "Preparing Grafana entities for init datasources and library panels"
              cp -r /tmp/grafana-entities/* /opt/grafana-entities/
      containers:
{{ include "grafana.initDatasources" . }}
{{ include "grafana.libraryInitContainer" . }}
{{ include "grafana.gitsyncProvisioning" . }}
