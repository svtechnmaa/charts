apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-init
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-entities-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "20"
    argogitsync.argoproj.io/hook: PostSync
    argogitsync.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argogitsync.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: grafana-entities-init
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "common.names.fullname" . }}-cd
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
      # shareVolume(volume): define in the global values
        {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
        {{- range .Values.global.sharedPersistenceVolume }}
        {{- if has $.Chart.Name .shareFor }}
        - name: {{ .volumeName }}
          persistentVolumeClaim:
            claimName: {{ .pvcName }}
        {{- end }}
        {{- end }}
        {{- end }}
      # unshareVolume(volume): define in the chart's values.yaml
        {{- if .Values.volumes }}
        {{- tpl (toYaml .Values.volumes) $ | nindent 8 }}
        {{- end }}
        - name: grafana-entities
          emptyDir: {}
      initContainers:
        - name: grafana-entities
          image: duchieu2920/grafana-entities:v1.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GITSYNC_URL
              value: {{ required "gitsync.url is required for the grafana-entities source" .Values.gitsync.url | quote }}
            - name: GITSYNC_REMOTE_BRANCH
              value: {{ required "gitsync.remote_branch is required for the grafana-entities source checkout" .Values.gitsync.remote_branch | quote }}
            - name: GITSYNC_FORCE_PUSH
              value: {{ .Values.gitsync.forcePush | toString | quote }}
            {{- if not (empty (default "" .Values.global.http_proxy)) }}
            - name: HTTPS_PROXY
              value: {{ .Values.global.http_proxy | quote }}
            {{- end }}
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.gitAuthSecretName" . | quote }}
                  key: {{ include "grafana.gitAuthUsernameKey" . | quote }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.gitAuthSecretName" . | quote }}
                  key: {{ include "grafana.gitAuthPasswordKey" . | quote }}
            {{- if contains "git-http" (lower (default "" .Values.gitsync.url)) }}
            - name: GITHUB_SOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.managedAuthSecretName" . | quote }}
                  key: signer_name
                  optional: true
            - name: GITHUB_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana.managedAuthSecretName" . | quote }}
                  key: token
                  optional: true
            {{- end }}
            - name: GIT_TERMINAL_PROMPT
              value: "0"
          volumeMounts:
            # shareVolume: VolumeMount
            {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
            {{- range .Values.global.sharedPersistenceVolume }}
            {{- if has $.Chart.Name .shareFor }}
            - name: {{ .volumeName }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
            {{- end }}
            # unshareVolume(volumeMount): define in the chart's values.yaml
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            - name: grafana-entities
              mountPath: /opt/grafana-entities
          command:
            - /bin/sh
            - -c
            - |
              set -Eeuo pipefail

              log() {
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
              }

              askpass_file="$(mktemp)"
              trap 'rm -f "$askpass_file"' EXIT
              cat > "$askpass_file" <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' "$GIT_USERNAME" ;;
                *Password*) printf '%s\n' "$GIT_TOKEN" ;;
              esac
              EOF
              chmod 700 "$askpass_file"
              export GIT_ASKPASS="$askpass_file"

              cd /tmp/grafana-entities

              source_https_proxy="${HTTPS_PROXY:-}"
              destination_username="$GIT_USERNAME"
              destination_token="$GIT_TOKEN"

              use_source_proxy() {
                case "$GITSYNC_URL" in
                  *[Gg][Ii][Tt]-[Hh][Tt][Tt][Pp]*)
                    export GIT_USERNAME="${GITHUB_SOURCE_USERNAME:-}"
                    export GIT_TOKEN="${GITHUB_SOURCE_TOKEN:-}"
                    ;;
                  *)
                    export GIT_USERNAME="$destination_username"
                    export GIT_TOKEN="$destination_token"
                    ;;
                esac
                if [ -n "$source_https_proxy" ]; then
                  export HTTPS_PROXY="$source_https_proxy"
                else
                  unset HTTPS_PROXY
                fi
              }

              use_destination_proxy() {
                export GIT_USERNAME="$destination_username"
                export GIT_TOKEN="$destination_token"
                case "$GITSYNC_URL" in
                  *[Gg][Ii][Tt][Hh][Uu][Bb]*) use_source_proxy ;;
                  *) unset HTTPS_PROXY ;;
                esac
              }

              checkout_exact() {
                target_ref="$1"
                description="$2"

                git checkout --detach --force "$target_ref"
                git clean -fdx
                log "Checked out ${description} at $(git rev-parse HEAD)"
              }

              classify_destination_ref() {
                target_ref="$1"
                target_sha="$2"

                if [ -z "$target_sha" ]; then
                  printf '%s\n' missing
                  return
                fi

                if ! git fetch --quiet --no-tags "$GITSYNC_URL" \
                     "+refs/heads/${target_ref}:refs/remotes/bootstrap-destination/${target_ref}"; then
                  log "Failed to fetch destination ${target_ref} for promotion preflight" >&2
                  return 1
                fi
                if [ "$target_sha" = "$selected_sha" ]; then
                  printf '%s\n' equal
                elif git merge-base --is-ancestor "$target_sha" "$selected_sha"; then
                  printf '%s\n' behind
                elif git merge-base --is-ancestor "$selected_sha" "$target_sha"; then
                  printf '%s\n' ahead
                else
                  printf '%s\n' diverged
                fi
              }

              require_force_permission() {
                target_ref="$1"
                target_sha="$2"
                relation="$3"

                case "$relation" in
                  ahead|diverged)
                    if [ "$GITSYNC_FORCE_PUSH" != "true" ]; then
                      log "Destination ${target_ref} (${target_sha}) is ${relation} relative to selected ${GITSYNC_REMOTE_BRANCH} (${selected_sha})." >&2
                      log "Refusing the non-fast-forward update because gitsync.forcePush=false." >&2
                      log "To intentionally override destination ${target_ref}, rerun with gitsync.forcePush=true." >&2
                      exit 1
                    fi
                    log "gitsync.forcePush=true: allowing ${relation} destination ${target_ref} (${target_sha}) to be replaced by ${selected_sha}"
                    ;;
                esac
              }

              if ! git check-ref-format "refs/heads/${GITSYNC_REMOTE_BRANCH}" >/dev/null 2>&1; then
                log "Invalid gitsync.remote_branch: ${GITSYNC_REMOTE_BRANCH}" >&2
                exit 1
              fi
              case "$GITSYNC_FORCE_PUSH" in
                true|false) ;;
                *)
                  log "gitsync.forcePush must be true or false; got: ${GITSYNC_FORCE_PUSH}" >&2
                  exit 1
                  ;;
              esac

              # Discard build-time working-tree changes from the entities image.
              image_sha="$(git rev-parse HEAD)"
              git reset --hard "$image_sha"
              git clean -fdx

              # GitHub is an external, read-only source for this Job. Never
              # seed, promote, or create upstream refs there. Grafana Git Sync
              # remains responsible for its own configured repository writes.
              case "$GITSYNC_URL" in
                *[Gg][Ii][Tt][Hh][Uu][Bb]*)
                  use_source_proxy
                  log "Using GitHub source branch ${GITSYNC_REMOTE_BRANCH} (read-only)"
                  if ! git ls-remote --exit-code --heads "$GITSYNC_URL" \
                       "refs/heads/${GITSYNC_REMOTE_BRANCH}" >/dev/null 2>&1; then
                    log "GitHub source branch is unreachable or missing: ${GITSYNC_REMOTE_BRANCH}" >&2
                    exit 1
                  fi
                  git fetch --no-tags "$GITSYNC_URL" \
                    "+refs/heads/${GITSYNC_REMOTE_BRANCH}:refs/remotes/bootstrap-source/selected"
                  checkout_exact refs/remotes/bootstrap-source/selected \
                    "GitHub source ${GITSYNC_REMOTE_BRANCH}"
                  log "GitHub mode is read-only; skipping destination seed and promotion"
                  log "Preparing Grafana entities for init datasources and library panels"
                  cp -r /tmp/grafana-entities/* /opt/grafana-entities/
                  exit 0
                  ;;
              esac

              # The proxy is intended for the image's source remote. Internal
              # destinations such as git-http must bypass it.
              use_destination_proxy
              if ! git ls-remote "$GITSYNC_URL" >/dev/null 2>&1; then
                log "Git destination is not reachable: ${GITSYNC_URL}" >&2
                exit 1
              fi

              remote_refs="$(
                git ls-remote --heads "$GITSYNC_URL" \
                  refs/heads/main \
                  refs/heads/upstream \
                  "refs/heads/${GITSYNC_REMOTE_BRANCH}"
              )"
              main_sha="$(
                printf '%s\n' "$remote_refs" |
                  awk '$2 == "refs/heads/main" { print $1; exit }'
              )"
              upstream_sha="$(
                printf '%s\n' "$remote_refs" |
                  awk '$2 == "refs/heads/upstream" { print $1; exit }'
              )"
              selected_destination_sha="$(
                printf '%s\n' "$remote_refs" |
                  awk -v ref="refs/heads/${GITSYNC_REMOTE_BRANCH}" '$2 == ref { print $1; exit }'
              )"

              promote_main=true
              selected_from_origin=false
              if [ "$GITSYNC_REMOTE_BRANCH" = "main" ] && [ -n "$main_sha" ]; then
                log "Using existing destination main ${main_sha}; the image snapshot will not overwrite it"
                git fetch --no-tags "$GITSYNC_URL" \
                  "+refs/heads/main:refs/remotes/bootstrap-destination/main"
                checkout_exact refs/remotes/bootstrap-destination/main "destination main"
                promote_main=false
              elif [ "$GITSYNC_REMOTE_BRANCH" = "main" ]; then
                log "Destination main does not exist; seeding it from image commit ${image_sha}"
                checkout_exact "$image_sha" "image main"
              elif [ -n "$selected_destination_sha" ]; then
                log "Using destination branch ${GITSYNC_REMOTE_BRANCH} at ${selected_destination_sha}"
                git fetch --no-tags "$GITSYNC_URL" \
                  "+refs/heads/${GITSYNC_REMOTE_BRANCH}:refs/remotes/bootstrap-destination/selected"
                checkout_exact refs/remotes/bootstrap-destination/selected \
                  "destination ${GITSYNC_REMOTE_BRANCH}"
              else
                if git remote get-url origin >/dev/null 2>&1; then
                  source_remote=origin
                else
                  source_remote="$(git remote | head -n 1)"
                fi
                if [ -z "$source_remote" ]; then
                  log "No Git source remote exists in the grafana-entities image" >&2
                  exit 1
                fi

                use_source_proxy
                log "Checking Git source remote ${source_remote}"
                if ! git ls-remote "$source_remote" >/dev/null 2>&1; then
                  log "Source remote is not reachable: ${source_remote}" >&2
                  exit 1
                fi
                if ! git ls-remote --exit-code --heads "$source_remote" \
                     "refs/heads/${GITSYNC_REMOTE_BRANCH}" >/dev/null 2>&1; then
                  log "Source branch does not exist: ${GITSYNC_REMOTE_BRANCH}" >&2
                  exit 1
                fi

                log "Fetching Grafana entities branch ${GITSYNC_REMOTE_BRANCH} from ${source_remote}"
                git fetch --no-tags "$source_remote" \
                  "+refs/heads/${GITSYNC_REMOTE_BRANCH}:refs/remotes/bootstrap-source/selected"
                checkout_exact refs/remotes/bootstrap-source/selected \
                  "source ${GITSYNC_REMOTE_BRANCH}"
                selected_from_origin=true
              fi

              selected_sha="$(git rev-parse HEAD)"
              use_destination_proxy

              # Preflight every managed destination ref before publishing or
              # promoting anything. This prevents a rejected promotion from
              # leaving only some refs updated.
              if [ "$promote_main" = true ]; then
                main_relation="$(classify_destination_ref main "$main_sha")"
                require_force_permission main "$main_sha" "$main_relation"
              else
                main_relation=equal
              fi
              upstream_relation="$(classify_destination_ref upstream "$upstream_sha")"
              require_force_permission upstream "$upstream_sha" "$upstream_relation"

              if [ "$selected_from_origin" = true ]; then
                log "Publishing source branch ${GITSYNC_REMOTE_BRANCH} to the destination"
                git push "$GITSYNC_URL" \
                  "HEAD:refs/heads/${GITSYNC_REMOTE_BRANCH}"
              fi

              if [ "$promote_main" = true ]; then
                case "$main_relation" in
                  missing)
                    log "Creating destination main at ${selected_sha}"
                    git push "$GITSYNC_URL" HEAD:refs/heads/main
                    ;;
                  equal)
                    log "Destination main already matches selected commit ${selected_sha}"
                    ;;
                  behind)
                    log "Fast-forwarding destination main from ${main_sha} to ${selected_sha}"
                    git push "$GITSYNC_URL" HEAD:refs/heads/main
                    ;;
                  ahead|diverged)
                    log "Force-promoting ${GITSYNC_REMOTE_BRANCH} (${selected_sha}) over ${main_relation} destination main (${main_sha})"
                    git push \
                      --force-with-lease="refs/heads/main:${main_sha}" \
                      "$GITSYNC_URL" \
                      HEAD:refs/heads/main
                    ;;
                esac
              fi

              case "$upstream_relation" in
                missing)
                  log "Creating missing upstream at ${selected_sha}"
                  git push "$GITSYNC_URL" HEAD:refs/heads/upstream
                  ;;
                equal)
                  log "Upstream already matches selected commit ${selected_sha}"
                  ;;
                behind)
                  log "Fast-forwarding upstream from ${upstream_sha} to ${selected_sha}"
                  git push "$GITSYNC_URL" HEAD:refs/heads/upstream
                  ;;
                ahead|diverged)
                  log "Force-synchronizing ${upstream_relation} upstream (${upstream_sha}) to selected commit (${selected_sha})"
                  git push \
                    --force-with-lease="refs/heads/upstream:${upstream_sha}" \
                    "$GITSYNC_URL" \
                    HEAD:refs/heads/upstream
                  ;;
              esac

              verified_refs="$(
                git ls-remote --heads "$GITSYNC_URL" \
                  refs/heads/main \
                  refs/heads/upstream
              )"
              actual_main_sha="$(
                printf '%s\n' "$verified_refs" |
                  awk '$2 == "refs/heads/main" { print $1; exit }'
              )"
              actual_upstream_sha="$(
                printf '%s\n' "$verified_refs" |
                  awk '$2 == "refs/heads/upstream" { print $1; exit }'
              )"
              if [ "$actual_main_sha" != "$selected_sha" ]; then
                log "Destination main verification failed: expected ${selected_sha}, got ${actual_main_sha:-missing}" >&2
                exit 1
              fi
              if [ "$actual_upstream_sha" != "$selected_sha" ]; then
                log "Destination upstream verification failed: expected ${selected_sha}, got ${actual_upstream_sha:-missing}" >&2
                exit 1
              fi

              log "Grafana entities main and upstream are ready at ${selected_sha}"
              log "Preparing Grafana entities for init datasources and library panels"
              cp -r /tmp/grafana-entities/* /opt/grafana-entities/
      containers:
{{ include "grafana.initDatasources" . }}
{{ include "grafana.libraryInitContainer" . }}
{{ include "grafana.gitsyncProvisioning" . }}
