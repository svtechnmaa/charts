{{- $adminManaged := not .Values.grafanaConfig.auth.existingSecret }}
{{- $dbManaged := not .Values.grafanaConfig.database.auth.existingSecret }}
{{- $hasWriteOrg := false -}}
{{- range (.Values.gitsync.organizations | default list) -}}
{{- if and . (hasKey . "write") .write -}}{{- $hasWriteOrg = true -}}{{- end -}}
{{- end }}
{{- $name := include "grafana.managedAuthSecretName" . }}
{{- $dbEncoded := "" }}
{{- $adminEncoded := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := default dict $existing.data }}
{{- if $adminManaged }}
{{- $local := tpl (default "" .Values.grafanaConfig.auth.password | toString) . }}
{{- $global := tpl (default "" .Values.global.authenUsers.grafana.password | toString) . }}
{{- $legacy := tpl (default "" .Values.global.adminPassword | toString) . }}
{{- $password := default (default $local $legacy) $global }}
{{- $key := include "grafana.adminSecretKey" . }}
{{- if hasKey $data $key }}
{{- $adminEncoded = required "Managed Grafana admin password key is empty; repair the Secret before upgrading" (index $data $key) }}
{{- else }}
{{- $adminEncoded = (default (randAlphaNum 32) $password) | b64enc }}
{{- end }}
{{- end }}
{{- if $dbManaged }}
{{- $password := tpl (default "" .Values.grafanaConfig.database.auth.password | toString) . }}
{{- $_ := required "grafanaConfig.database.auth.password or grafanaConfig.database.auth.existingSecret is required; provision the DB account with the same password" $password }}
{{- $key := include "grafana.databaseSecretKey" . }}
{{- if hasKey $data $key }}
{{- $dbEncoded = required "Managed Grafana database password key is empty; repair the Secret before upgrading" (index $data $key) }}
{{- else }}
{{- $dbEncoded = $password | b64enc }}
{{- end }}
{{- if and $adminManaged (eq (include "grafana.adminSecretKey" .) (include "grafana.databaseSecretKey" .)) }}
{{- fail "Grafana admin and database passwords must use different Secret keys" }}
{{- end }}
{{- end }}
{{/* The chart-managed Secret cannot simultaneously be declared external. */}}
{{- if and (not $adminManaged) (eq (include "grafana.adminSecretName" .) $name) }}
{{- fail "External admin Secret uses the chart-managed auth Secret name; choose a different external admin Secret name" }}
{{- end }}
{{- if and (not $dbManaged) (eq (include "grafana.databaseSecretName" .) $name) }}
{{- fail "External database Secret uses the chart-managed auth Secret name; choose a different external database Secret name" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-admin
type: Opaque
{{- if or $adminManaged $dbManaged }}
data:
  {{- if $adminManaged }}
  {{ include "grafana.adminSecretKey" . | quote }}: {{ $adminEncoded | quote }}
  {{- end }}
  {{- if $dbManaged }}
  {{ include "grafana.databaseSecretKey" . | quote }}: {{ $dbEncoded | quote }}
  {{- end }}
{{- end }}
stringData:
  token: {{ .Values.global.github.fg_token | quote }}
  signer_name: {{ .Values.global.github.user | quote }}
  {{- if and .Values.global.github.signing_key .Values.global.github.email $hasWriteOrg }}
  signing_key: {{ .Values.global.github.signing_key | quote }}
  signer_email: {{ .Values.global.github.email | quote }}
  {{- end }}
