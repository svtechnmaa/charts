{{- $adminManaged := not .Values.grafanaConfig.auth.existingSecret }}
{{- $dbManaged := not .Values.grafanaConfig.database.auth.existingSecret }}
{{- $tokenManaged := and (not (empty (include "grafana.rendererTokenEnabled" .))) (not .Values.renderer.existingSecret) }}
{{- if or $adminManaged $dbManaged $tokenManaged }}
{{- $name := include "grafana.managedAuthSecretName" . }}
{{- $dbEncoded := "" }}
{{- $adminEncoded := "" }}
{{- $tokenEncoded := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := default dict $existing.data }}
{{- if $adminManaged }}
{{- $local := tpl (default "" .Values.grafanaConfig.auth.password | toString) . }}
{{- $global := tpl (default "" .Values.global.authenUsers.grafana.password | toString) . }}
{{- $legacy := tpl (default "" .Values.global.adminPassword | toString) . }}
{{- $password := default (default $local $legacy) $global }}
{{- $key := include "grafana.adminSecretKey" . }}
{{- if hasKey $data $key }}
{{- $adminEncoded = required "Managed Grafana admin password key is empty; repair the Secret before upgrading" (index $data $key) }}
{{- else }}
{{- $adminEncoded = (default (randAlphaNum 32) $password) | b64enc }}
{{- end }}
{{- end }}
{{- if $dbManaged }}
{{- $password := tpl (default "" .Values.grafanaConfig.database.auth.password | toString) . }}
{{- $_ := required "grafanaConfig.database.auth.password or grafanaConfig.database.auth.existingSecret is required; provision the DB account with the same password" $password }}
{{- $key := include "grafana.databaseSecretKey" . }}
{{- if hasKey $data $key }}
{{- $dbEncoded = required "Managed Grafana database password key is empty; repair the Secret before upgrading" (index $data $key) }}
{{- else }}
{{- $dbEncoded = $password | b64enc }}
{{- end }}
{{- if and $adminManaged (eq (include "grafana.adminSecretKey" .) (include "grafana.databaseSecretKey" .)) }}
{{- fail "Grafana admin and database passwords must use different Secret keys" }}
{{- end }}
{{/* Never overwrite an external admin Secret with the DB fallback. */}}
{{- if and (not $adminManaged) (eq (include "grafana.adminSecretName" .) $name) }}
{{- fail "External admin Secret uses the chart-managed auth Secret name; provide database.auth.existingSecret too or choose a different external admin Secret name" }}
{{- end }}
{{- end }}
{{- if $tokenManaged }}
{{- $key := .Values.renderer.existingSecretKey }}
{{- if or (and $adminManaged (eq $key (include "grafana.adminSecretKey" .))) (and $dbManaged (eq $key (include "grafana.databaseSecretKey" .))) }}
{{- fail "Grafana renderer token must use a different Secret key from the admin and database passwords" }}
{{- end }}
{{/* Never overwrite an external admin or database Secret with the token. */}}
{{- if or (and (not $adminManaged) (eq (include "grafana.adminSecretName" .) $name)) (and (not $dbManaged) (eq (include "grafana.databaseSecretName" .) $name)) }}
{{- fail "External admin or database Secret uses the chart-managed auth Secret name; set renderer.existingSecret or choose a different Secret name" }}
{{- end }}
{{- if hasKey $data $key }}
{{- $tokenEncoded = required "Managed Grafana renderer token key is empty; repair the Secret before upgrading" (index $data $key) }}
{{- else }}
{{- $tokenEncoded = (default (randAlphaNum 64) (tpl (toString .Values.renderer.authToken) .)) | b64enc }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana-admin
type: Opaque
data:
  {{- if $adminManaged }}
  {{ include "grafana.adminSecretKey" . | quote }}: {{ $adminEncoded | quote }}
  {{- end }}
  {{- if $dbManaged }}
  {{ include "grafana.databaseSecretKey" . | quote }}: {{ $dbEncoded | quote }}
  {{- end }}
  {{- if $tokenManaged }}
  {{ .Values.renderer.existingSecretKey | quote }}: {{ $tokenEncoded | quote }}
  {{- end }}
{{- end }}
