apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "common.replicas" ( dict "replicaCount" .Values.replicaCount "global" .Values.global ) }}
  strategy:
    type: {{ .Values.updateStrategy }}
    {{- if (eq "Recreate" .Values.updateStrategy) }}
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- end }}

      {{- if .Values.init }}
      initContainers:
        - name: wait-for-mariadb
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.init.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.grafanaConfig.database.mysqlHost }}
              until nc -zvw5 {{ .Values.grafanaConfig.database.mysqlHost }} 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- else }}
              until nc -zvw5 mariadb 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- end }}
      {{- end }}

      containers:
        - name: grafana
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.image "global" .Values.global ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
          {{- end }}
          envFrom:
          - secretRef:
              name: {{ include "common.names.fullname" . }}-auth
          env:
            - name: TZ
              value: {{ include "common.timezone" ( dict "timezone" .Values.timezone "global" .Values.global) }}
            - name: GF_DATABASE_TYPE
              value: mysql
            - name: GF_DATABASE_HOST
              value: {{ .Values.grafanaConfig.database.mysqlHost | quote }}
            - name: GF_DATABASE_PORT
              value: {{ .Values.grafanaConfig.database.mysqlPort | quote }}
            - name: GF_DATABASE_NAME
            {{- if index (index .Values.global "mariadb-galera") "enabled" }}
              value: {{ tpl .Values.grafanaConfig.database.mysqlDB . | required "grafanaConfig.database.mysqlDB is required" | quote }}
            {{- else }}
              value: {{ printf "%s_%s" .Release.Namespace (tpl .Values.grafanaConfig.database.mysqlDB . | required "grafanaConfig.database.mysqlDB is required") | quote }}
            {{- end }}
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "common.names.fullname" . }}-auth
                  key: grafana_database_user
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "common.names.fullname" . }}-auth
                  key: grafana_database_password
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "common.names.fullname" . }}-auth
                  key: grafana_admin_user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "common.names.fullname" . }}-auth
                  key: grafana_admin_password
            - name: GF_SECURITY_ANGULAR_SUPPORT_ENABLED
              value: "true"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: none
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
            - name: GF_PROVISIONING_ALLOWED_GIT_URLS
              value: git-http:8080
            - name: GF_PROVISIONING_ALLOW_INSECURE
              value: true
            - name: GF_SERVER_ROOT_URL
              value: {{ default (printf "%s://%s%s" (ternary "https" "http" (default false .Values.global.enableHttps)) .Values.global.frontendVip .Values.grafanaConfig.subPath) .Values.grafanaConfig.rootUrl | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: {{ (ternary "true" "false" (not (empty .Values.grafanaConfig.subPath))) | quote }}
            - name: GF_PANELS_DISABLE_SANITIZE_HTML
              value: "true"
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: icinga2-report-datasource,icinga2-report-panel,icinga2-report-panel-transposed,mahendrapaipuri-dashboardreporter-app
            - name: GF_LOG_FILTERS
              value: rendering:debug plugin.mahendrapaipuri-dashboardreporter-app:debug
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: accessControlOnCall,idForwarding
            - name: GF_REPORTER_PLUGIN_APP_URL
              value: "http://{{ .Chart.Name }}:{{ .Values.service.port }}{{ .Values.grafanaConfig.subPath }}"
            {{- with .Values.renderer.url }}
            - name: GF_RENDERING_SERVER_URL
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with .Values.chrome.url }}
            - name: GF_REPORTER_PLUGIN_REMOTE_CHROME_URL
              value: {{ tpl . $ | quote }}
            {{- end }}
            - name: GF_RENDERING_CALLBACK_URL
              value: "http://{{ .Chart.Name }}:{{ .Values.service.port }}{{ .Values.grafanaConfig.subPath }}"
            - name: GF_REPORTER_PLUGIN_SKIP_TLS_CHECK
              value: "true"
            - name: GF_REPORTER_PLUGIN_NATIVE_RENDERER
              value: "false"
            - name: GF_REPORTER_PLUGIN_REPORT_ORIENTATION
              value: landscape
            - name: GF_REPORTER_PLUGIN_REPORT_LAYOUT
              value: grid
            - name: GF_REPORTER_PLUGIN_REPORT_DASHBOARD_MODE
              value: full
            {{- if .Values.grafanaConfig.env }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.grafanaConfig.env "context" $ ) | nindent 12 }}
            {{- end }}
          ports:
            - name: grafana
              containerPort: 3000
          volumeMounts:
            # shareVolume: VolumeMount
            {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
            {{- range .Values.global.sharedPersistenceVolume }}
            {{- if has $.Chart.Name .shareFor }}
            - name: {{ .volumeName }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
            {{- end }}
            # unshareVolume(volumeMount): define in the chart's values.yaml
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
        {{- if .Values.chrome.enabled }}
        - args:
          - --ignore-certificate-errors
          - --disable-gpu
          - --headless
          - --no-sandbox
          - --disable-dev-shm-usage
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.chrome.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.chrome.image.pullPolicy | quote }}
          name: chrome
          ports:
          - containerPort: {{ .Values.chrome.service.port }}
            protocol: TCP
            name: chrome
          resources:
            {{- toYaml .Values.chrome.resources | nindent 12 }}
          volumeMounts:
          - mountPath: /dev/shm
            name: shm
        {{- end }}
        {{- if .Values.renderer.enabled }}
        - env:
          - name: IGNORE_HTTPS_ERRORS
            value: "true"
          - name: RENDERING_MODE
            value: clustered
          - name: RENDERING_CLUSTERING_MODE
            value: browser
          - name: RENDERING_CLUSTERING_MAX_CONCURRENCY
            value: "15"
          - name: RENDERING_CLUSTERING_TIMEOUT
            value: "120"
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.renderer.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.renderer.image.pullPolicy | quote }}
          name: renderer
          ports:
          - containerPort: {{ .Values.renderer.service.port }}
            name: renderer
            protocol: TCP
        {{- end }}
      volumes:
      {{- if .Values.chrome.enabled }}
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
      {{- end }}
      # shareVolume(volume): define in the global values
        {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
        {{- range .Values.global.sharedPersistenceVolume }}
        {{- if has $.Chart.Name .shareFor }}
        - name: {{ .volumeName }}
          persistentVolumeClaim:
            claimName: {{ .pvcName }}
        {{- end }}
        {{- end }}
        {{- end }}
      # unshareVolume(volume): define in the chart's values.yaml
        {{- if .Values.volumes }}
        {{- tpl (toYaml .Values.volumes) $ | nindent 8 }}
        {{- end }}
      imagePullSecrets:
      - name: ghcr-pull-secret
