global:
  # Auth precedence: nonempty authenUsers.grafana > legacy adminUser/adminPassword > grafanaConfig.auth.
  # Remove legacy keys when migrating to local auth; stored Secrets take priority for passwords.
  authenUsers:
    grafana:
      user: "" # Non-empty global input overrides grafanaConfig.auth.username
      password: "" # Empty: generate and preserve a 32-character password.
  github:
    user: ""
    email: ""
    fg_token: ""
    signing_key: |    # SSH or GPG private key

  # Optional HTTPS proxy used by the entities init container in GitHub mode.
  http_proxy: ""

  sharedVolume:
    enabled: false
  externalIP: "" # externalIP for CICD
  frontendVip: ""
  mariadb-galera:
    enabled: true
  enableHttps: true

timezone: Asia/Ho_Chi_Minh

init:
  image:
    registry: ghcr.io
    repository: svtechnmaa/busybox
    tag: 1.33
    pullPolicy: IfNotPresent

image:
  registry: ghcr.io
  repository: svtechnmaa/svtech_grafana
  tag: v1.3.3
  pullPolicy: IfNotPresent
  # debug: true

grafanaEntities:
  image:
    registry: ghcr.io
    repository: svtechnmaa/grafana-entities
    tag: v1.0.2
    pullPolicy: IfNotPresent

renderer:
  enabled: true
  url: "http://renderer:8081/render" # May point to a shared/external renderer; empty omits the env.
  image:
    registry: ghcr.io
    repository: svtechnmaa/grafana-image-renderer
    tag: v4.0.10
    pullPolicy: IfNotPresent
  service:
    port: 8081
    type: ClusterIP
  # Shared secret between Grafana ([rendering] renderer_token) and the renderer (AUTH_TOKEN).
  # Grafana 13+ refuses to start with the default token, so the chart always sets one.
  # By default the token is stored as a key in the chart-managed <fullname>-admin Secret.
  auth:
    token: "" # First install only. Empty: generate 64 random characters. Upgrades keep the stored value.
    existingSecret: "" # Secret you manage yourself (same namespace). Must not be the chart-managed <fullname>-admin.
    existingSecretTokenKey: GF_RENDERING_RENDERER_TOKEN # Key holding the token, in the managed or the existing Secret.

chrome:
  enabled: true
  url: "http://chrome:9222" # May point to shared/external Chrome; empty omits the env.
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m
  image:
    registry: ghcr.io
    repository: svtechnmaa/headless-shell
    tag: 146.0.7680.80
    pullPolicy: IfNotPresent
  service:
    port: 9222
    type: ClusterIP

clusterDomain: cluster.local
commonAnnotations:
  helm.sh/hook-weight: "0"
commonLabels: {}

replicaCount: 2

updateStrategy: RollingUpdate
podManagementPolicy: OrderedReady
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  ## Node affinity type
  ## Allowed values: soft, hard
  type: ""
  ## Node label key to match
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  key: ""
  ## Node label values to match
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []


## Affinity for pod assignment
## Note: podAffinityPreset, podAntiAffinityPreset, and  nodeAffinityPreset will be ignored when it's set
##
affinity: {}

## Node labels for pod assignment
nodeSelector: {}

## Tolerations for pod assignment
tolerations: []

## Extra volumes and mounts for the Grafana deployment.
volumes: []
volumeMounts: []
securityContext:
  enabled: false
  fsGroup: 0
  runAsUser: 0

resources:
  limits: {}
  #   cpu: 100m
  #   memory: 128Mi
  requests: {}
  #   cpu: 100m
  #   memory: 128Mi


livenessProbe:
  enabled: false
  initialDelaySeconds: 180
  periodSeconds: 45
  timeoutSeconds: 30
  successThreshold: 1
  failureThreshold: 6
readinessProbe:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 45
  timeoutSeconds: 30
  successThreshold: 1
  failureThreshold: 6

## Custom Liveness probe
customLivenessProbe: {}

## Custom Readiness probe
customReadinessProbe: {}

## Container ports
containerPorts:
  # icinga2Api: 5665
  # livestatus: 6558

service:
  ## Service type
  ##
  type: ClusterIP
  port: 3000

  # loadBalancerIP:
  # loadBalancerSourceRanges:
  # - 10.10.10.0/24

  externalIPs: []

  ## Set the Cluster IP to use
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#choosing-your-own-ip-address
  ##
  # clusterIP: None
  ## Provide any additional annotations which may be required
  ##
  annotations: {}
  ## Set the service SessionAffinity for session stickiness
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#proxy-mode-userspace
  sessionAffinity: ClientIP

  ## Customize the SessionAffinity configuration. The default value for sessionAffinityConfig.clientIP.timeoutSeconds is 10800 (3 hours)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 7200

ingress:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($cookie_grafana_session != "") {
        add_header Set-Cookie "ref_grafana_session=$cookie_grafana_session; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400" always;
      }
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

grafanaConfig:
  database:
    auth:
      existingSecret: ""
      existingSecretPasswordKey: DB_PASSWORD
      username: grafana
      password: "juniper@123"
    mysqlHost: "mariadb"
    mysqlPort: 3306
    mysqlDB: grafana
  auth:
    username: ""
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: GF_SECURITY_ADMIN_PASSWORD
  subPath: /grafana
  env: []

gitsync:
  enabled: true
  mode: git # git or github
  # Reference the git-http producer Secret; Grafana never copies its credentials.
  git:
    auth:
      existingSecret: git-http-auth
      usernameKey: username
      passwordKey: password
    url: "http://git-http:8080/git/grafana-entities.git"
    organizations:
      - org: "Main"
        write: true
        branch: "main"
        path: [nmaa, itim]


  github:
    url: "https://github.com/svtechnmaa/grafana-entities"
    organizations:
      - org: "Main"
        write: true
        branch: "main"
        path: [nmaa, itim]

  # Shared initial datasource credentials. Existing datasources are not updated.
  secureFiles:
    icingadb:
      user: icingadb_user
      password: icingadb_password
    influxdb-flux:
        token: influxdb_user:influxdb_password
    influxdb:
        user: influxdb_user
        password: influxdb_password
    junos-tableview:
      user: junos_user
      password: junos_password
    audit-config:
      user: audit_user
      password: audit_password
    elasticsearch:
      user: elastic_user
      basicAuthPassword: elastic_password
