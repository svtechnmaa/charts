global:
  # Auth precedence: nonempty authenUsers.grafana > legacy adminUser/adminPassword > grafanaConfig.auth.
  # Remove legacy keys when migrating to local auth; stored Secrets take priority for passwords.
  authenUsers:
    grafana:
      user: "" # Non-empty global input overrides grafanaConfig.auth.username
      password: "" # Empty: generate and preserve a 32-character password.
  github:
    user: ""
    email: ""
    fg_token: ""
    signing_key: |    # SSH or GPG private key

  # Optional HTTPS proxy used by the entities init container in GitHub mode.
  http_proxy: ""

  sharedVolume:
    enabled: false
  externalIP: "" # externalIP for CICD
  frontendVip: ""
  mariadb-galera:
    enabled: true
  enableHttps: true

timezone: Asia/Ho_Chi_Minh

init:
  image:
    registry: ghcr.io
    repository: svtechnmaa/busybox
    tag: 1.33
    pullPolicy: IfNotPresent

image:
  registry: docker.io
  repository: duchieu2920
  tag: svtech_grafana:v13.1.3-ubuntu
  pullPolicy: IfNotPresent
  # debug: true

renderer:
  enabled: true
  url: "http://renderer:8081/render" # May point to a shared/external renderer; empty omits the env.
  image:
    registry: ghcr.io
    repository: svtechnmaa/grafana-image-renderer
    tag: v4.0.10
    pullPolicy: IfNotPresent
  service:
    port: 8081
    type: ClusterIP

chrome:
  enabled: true
  url: "http://chrome:9222" # May point to shared/external Chrome; empty omits the env.
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m
  image:
    registry: ghcr.io
    repository: svtechnmaa/headless-shell
    tag: 146.0.7680.80
    pullPolicy: IfNotPresent
  service:
    port: 9222
    type: ClusterIP

clusterDomain: cluster.local
commonAnnotations:
  helm.sh/hook-weight: "0"
commonLabels: {}

replicaCount: 2

updateStrategy: RollingUpdate
podManagementPolicy: OrderedReady
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  ## Node affinity type
  ## Allowed values: soft, hard
  type: ""
  ## Node label key to match
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  key: ""
  ## Node label values to match
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []


## Affinity for pod assignment
## Note: podAffinityPreset, podAntiAffinityPreset, and  nodeAffinityPreset will be ignored when it's set
##
affinity: {}

## Node labels for pod assignment
nodeSelector: {}

## Tolerations for pod assignment
tolerations: []

## Extra volumes to add to the deployment
volumes:
  - name: datasource-runtime
    configMap:
      name: '{{ include "common.names.fullname" . }}-datasources'
      optional: true

## Extra volume mounts to add to the container
volumeMounts:
  - name: datasource-runtime
    mountPath: /etc/grafana/provisioning/datasources
    readOnly: true
securityContext:
  enabled: false
  fsGroup: 0
  runAsUser: 0

resources:
  limits: {}
  #   cpu: 100m
  #   memory: 128Mi
  requests: {}
  #   cpu: 100m
  #   memory: 128Mi


livenessProbe:
  enabled: false
  initialDelaySeconds: 180
  periodSeconds: 45
  timeoutSeconds: 30
  successThreshold: 1
  failureThreshold: 6
readinessProbe:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 45
  timeoutSeconds: 30
  successThreshold: 1
  failureThreshold: 6

## Custom Liveness probe
customLivenessProbe: {}

## Custom Readiness probe
customReadinessProbe: {}

## Container ports
containerPorts:
  # icinga2Api: 5665
  # livestatus: 6558

service:
  ## Service type
  ##
  type: ClusterIP
  port: 3000

  # loadBalancerIP:
  # loadBalancerSourceRanges:
  # - 10.10.10.0/24

  externalIPs: []

  ## Set the Cluster IP to use
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#choosing-your-own-ip-address
  ##
  # clusterIP: None
  ## Provide any additional annotations which may be required
  ##
  annotations: {}
  ## Set the service SessionAffinity for session stickiness
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#proxy-mode-userspace
  sessionAffinity: ClientIP

  ## Customize the SessionAffinity configuration. The default value for sessionAffinityConfig.clientIP.timeoutSeconds is 10800 (3 hours)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 7200

ingress:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($cookie_grafana_session != "") {
        add_header Set-Cookie "ref_grafana_session=$cookie_grafana_session; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400" always;
      }
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

grafanaConfig:
  database:
    auth:
      existingSecret: ""
      existingSecretPasswordKey: DB_PASSWORD
      username: grafana
      password: "juniper@123"
    mysqlHost: "mariadb"
    mysqlPort: 3306
    mysqlDB: grafana
  auth:
    username: ""
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: GF_SECURITY_ADMIN_PASSWORD
  subPath: /grafana
  env: []

gitsync:
  # Reference the producer Secret; Grafana never copies git-http credentials. Use when gitsync.url ~ git-http.
  gitHttp:
    auth:
      existingSecret: git-http-auth
      usernameKey: username
      passwordKey: password
  url: "http://git-http:8080/git/grafana-entities.git"
  # Desired source branch for all entities. GitHub is read-only to this init
  # Job. For git-http, existing destination main wins when this is main; a
  # non-main branch is promoted to destination main. Ahead or diverged main and
  # upstream refs are protected unless forcePush is explicitly enabled.
  # Git Sync branches remain explicit per organization below.
  remote_branch: "main"
  forcePush: false
  path: [nmaa, itim]
  organizations:
    - org: "Main"
      write: true
      branch: "main"
      path: [nmaa, itim]
    - org: "Upstream"
      write: false
      branch: "upstream"
      path: [nmaa, itim]

  # Raw URL for one combined datasource file, or a GitHub Contents API URL
  # for a directory whose files each contain one datasource list item.
  # secure credential for connections(grafana datasource)
  secureFiles:
    icingadb:
      user: icingadb_user
      password: icingadb_password
    influxdb:
        user: influxdb_user
        password: influxdb_password
    junos-tableview:
      user: junos_user
      password: junos_password
    audit-config:
      user: audit_user
      password: audit_password
    elasticsearch:
      user: elastic_user
      basicAuthPassword: elastic_password
