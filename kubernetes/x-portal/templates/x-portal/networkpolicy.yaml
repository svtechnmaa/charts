{{- if and .Values.networkPolicy.enabled .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "x-portal.name" . }}
  labels:
    {{- include "x-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "x-portal.gatewaySelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
{{- end }}
