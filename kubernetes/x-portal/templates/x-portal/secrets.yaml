{{- $components := list -}}
{{- $gatewayName := include "x-portal.secretName" (dict "auth" .Values.gateway.auth "component" "gateway" "context" .) -}}
{{- $previousGateway := lookup "v1" "Secret" .Release.Namespace $gatewayName -}}
{{- if or .Values.gateway.enabled $previousGateway .Values.gateway.auth.mysqlDsn .Values.gateway.auth.homeMysqlDsn .Values.gateway.auth.oidcClientSecret -}}
{{- $components = append $components (dict "name" "gateway" "auth" .Values.gateway.auth "fields" (list "mysqlDsn" "homeMysqlDsn" "oidcClientSecret")) -}}
{{- end -}}
{{- if .Values.migration.enabled -}}
{{- $components = append $components (dict "name" "migration" "auth" .Values.migration.auth "fields" (list "mysqlDsn")) -}}
{{- end -}}
{{- if .Values.bootstrap.enabled -}}
{{- $components = append $components (dict "name" "bootstrap" "auth" .Values.bootstrap.auth "fields" (list "keycloakAdmin" "deploy" "recovery")) -}}
{{- end -}}
{{- range $component := $components -}}
{{- $auth := $component.auth -}}
{{- if not $auth.existingSecret -}}
{{- $name := include "x-portal.secretName" (dict "auth" $auth "component" $component.name "context" $) -}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name | default dict -}}
{{- $data := default dict $existing.data -}}
{{- $result := dict -}}
{{- range $field := $component.fields -}}
{{- $key := include "x-portal.secretKey" (dict "auth" $auth "field" $field "context" $) -}}
{{- if hasKey $result $key -}}
{{- fail (printf "%s.auth.secretKeys must use distinct keys" $component.name) -}}
{{- end -}}
{{- $value := "" -}}
{{- if hasKey $data $key -}}
{{- $value = required (printf "Managed Secret %s key %s is empty; repair it before upgrading" $name $key) (index $data $key) -}}
{{- else -}}
{{- $provided := tpl (default "" (index $auth $field) | toString) $ -}}
{{- $provided = required (printf "%s.auth.%s or %s.auth.existingSecret is required; provision the matching external credential first" $component.name $field $component.name) $provided -}}
{{- $value = $provided | b64enc -}}
{{- end -}}
{{- $_ := set $result $key $value -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
type: Opaque
data:
  {{- toYaml $result | nindent 2 }}
{{ end -}}
{{- end -}}
