# Site input example: replace URLs/realm/client IDs and set image.digest or image.tag.
global:
  # Documentation IP; replace with the parent stack's actual frontend VIP.
  frontendVip: 192.0.2.10
image:
  tag: ""
  digest: ""
  pullSecrets: [ghcr-pull-secret]
gateway:
  auth:
    existingSecret: x-portal-runtime
  tls:
    # cert-manager creates the TLS Secret. Nonempty uses an external Secret instead.
    existingSecret: ""
trust:
  existingConfigMap: x-portal-trust
migration:
  enabled: false
  auth:
    existingSecret: x-portal-migrator
bootstrap:
  enabled: false
  auth:
    existingSecret: x-portal-bootstrap
# Both claims may instead be provisioned externally with existingClaim.
homeSecrets:
  persistence:
    size: 1Gi
audit:
  retentionDays: 30
  persistence:
    size: 1Gi
