{{- if .Values.postgresql.enabled }}
{{- $standalonePersistence := .Values.postgresql.primary.persistence }}
{{- $hostPath := required "persistence.hostPath is required when postgresql.enabled is true" .Values.persistence.hostPath }}
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: postgresql-standalone-postgresql
# provisioner: kubernetes.io/no-provisioner
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true

{{- $namespace := .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ $namespace }}-data-postgresql-standalone-postgresql"
  labels:
    app.kubernetes.io/name: postgresql-standalone-postgresql
    statefulset.kubernetes.io/pod-name: "{{ $.Release.Name }}-postgresql-standalone-postgresql"
spec:
  storageClassName: {{ $standalonePersistence.storageClass | quote }}
  capacity:
    storage: {{ $standalonePersistence.size | quote }}
  accessModes:
    {{- toYaml $standalonePersistence.accessModes | nindent 4 }}
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: {{ printf "%s/%s-data-postgresql-standalone-postgresql/" (trimSuffix "/" $hostPath) $namespace | quote }}

{{- end }}
