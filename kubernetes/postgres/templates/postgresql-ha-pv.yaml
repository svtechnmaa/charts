{{- if (index .Values "postgresql-ha" "enabled") }}
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: postgresql-ha-postgresql
# provisioner: kubernetes.io/no-provisioner
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true

{{- $namespace := .Release.Namespace }}
{{- $haPersistence := index .Values "postgresql-ha" "persistence" }}

{{- range $index, $_ := until (int (index .Values "postgresql-ha").postgresql.replicaCount) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ $namespace }}-data-postgresql-ha-postgresql-{{ $index }}"
  labels:
    app.kubernetes.io/name: postgresql-ha-postgresql
    statefulset.kubernetes.io/pod-name: "{{ $.Release.Name }}-postgresql-ha-postgresql-{{ $index }}"
spec:
  storageClassName: {{ $haPersistence.storageClass | quote }}
  capacity:
    storage: {{ $haPersistence.size | quote }}
  accessModes:
    {{- toYaml $haPersistence.accessModes | nindent 4 }}
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # path: {{ $.Values.persistence.hostPath | quote }}
    path: {{ $.Values.persistence.hostPath }}/{{ $namespace }}-data-postgresql-ha-postgresql-{{ $index }}/
  # nodeAffinity:
  #   required:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: node_id
  #         operator: In
  #         values:
  #         - "{{ $index }}"

{{- end }}
{{- end }}
