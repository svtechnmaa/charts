{{- if eq .Values.architecture "distribute" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "common.names.fullname" . }}-master
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: icinga2
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Chart.Name }}-headless
  podManagementPolicy: {{ .Values.master.podManagementPolicy }}
  replicas: {{ include "common.replicas" ( dict "replicaCount" .Values.master.replicaCount "global" .Values.global ) }}
  revisionHistoryLimit: 10
  updateStrategy:
    type: {{ .Values.master.updateStrategy }}
    {{- if (eq "OnDelete" .Values.master.updateStrategy) }}
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: icinga2
  template:
    metadata:
      labels:
        {{ include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: icinga2
    spec:
      serviceAccountName: icinga2-master
      {{- if .Values.master.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.master.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.master.podAffinityPreset "component" "master" "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.master.podAntiAffinityPreset "component" "master" "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.master.nodeAffinityPreset.type "key" .Values.master.nodeAffinityPreset.key "values" .Values.master.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.master.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.master.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.master.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.master.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.master.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.master.securityContext.fsGroup }}
      {{- end }}
      containers:
        # icinga2 container
        - name: icinga2
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.image "global" .Values.global ) }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.master.securityContext.enabled }}
          securityContext:
            runAsUser: {{ .Values.master.securityContext.runAsUser }}
          {{- end }}
          command:
          - bash
          - -ec
          - |
            function log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
            }

            # Define a function to copy files from source to destination if destination does not exist or is empty
            # Change ownership to icinga:icinga and permission to 775 for the destination folder and its contents
            function copy_if_not_exist {
              src="$1"
              dest="$2"
              if [[ ! -e $dest ]] || [[ -z "$(ls -A "$dest" | grep -Ev 'lost\+found|^\.st' 2>/dev/null)" ]]; then
                log "$dest does not exist or is empty. Copying from $src to $dest"
                rsync -azvh $src $dest
                chown icinga:icinga $dest -R && chmod 775 $dest -R
              else
                log "$dest already exists and is not empty. Take no action"
              fi
            }

            #########################################################################################
            log "Start icinga2 master command script"
            # Prepare icinga2 config and plugins by SVTECH
            log "Prepare icinga2 config and plugins by SVTECH"
            export REPO_DIR="/opt/SVTECH-Junos-Automation"
            export PLUGIN_DIR="/usr/share/icinga2/plugins/libexec"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/plugins-go/*" "/opt/default_plugin/plugins-go"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/plugins-py/*" "/opt/default_plugin/plugins-py"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/plugins-pl/*" "/opt/default_plugin/plugins-pl"
            copy_if_not_exist "$REPO_DIR/module_utils/*" "/opt/default_plugin/module_utils"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/configs/global-templates/*" "/opt/zones.d/global-templates"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/configs/master/*" "/opt/zones.d/master"
            copy_if_not_exist "$REPO_DIR/icinga2-entities/scripts/*" "/etc/icinga2/scripts"
            copy_if_not_exist "/opt/default_config/conf.d/*" "/etc/icinga2/conf.d"
            copy_if_not_exist "/opt/default_config/features-available/*" "/etc/icinga2/features-available"
            copy_if_not_exist "/opt/default_plugin/*" "$PLUGIN_DIR"

            cp --update --remove-destination --symbolic-link $PLUGIN_DIR/plugins-pl/* "$PLUGIN_DIR"

            # Create all_config folder for dynamic rebalance
            log "Create all_config folder for dynamic rebalance"
            mkdir -p /opt/zones.d/all_config
            chmod -R 775 /opt/zones.d/all_config

            # Icinga2 Setup
            echo "***************** ICINGA2 PREPARE FOR NODE SETUP **********************"
            MASTER_NAME_ORIGIN=${RELEASE_NAME}-${CHART_NAME}-master
            SATELLITE_NAME_ORIGIN=${RELEASE_NAME}-${CHART_NAME}-satellite
            FULL_POD_NAME=${POD_NAME}.${CHART_NAME}-headless.${NAMESPACE}.svc.${CLUSTER_DOMAIN}
            COMMON_NAME=${POD_NAME}
            POD_INDEX=${POD_NAME: -1}
            if [[ $POD_INDEX != "0" ]]; then
              log "Init variable for icinga2 master node setup as satellite role"
              ROLE="satellite"
              PARENT_NAME=${MASTER_NAME_ORIGIN}-0
              PARENT_ZONE=${ZONE}
              PARENT_HOST=${CHART_NAME}
              PARENT_PORT=5665
              TRUSTEDCERT=/var/lib/icinga2/certs/trusted-parent.crt
              ZONE=${ZONE}
            fi

            # change permission /var/lib/icinga2 because of persistent volume from different user
            chmod 777 /var/lib/icinga2 -R
            echo "role: $ROLE, endpoint: $PARENT_NAME, parent_host: $PARENT_HOST, parent_port: $PARENT_PORT, parent_zone: $PARENT_ZONE, common_name: $COMMON_NAME, zone: $ZONE, icinga2_host: $ICINGA_HOST, icinga2_port: $ICINGA_PORT"

            echo "***************** ICINGA2 NODE SETUP **********************"
            /opt/scripts/entrypoint.sh no_start
            echo "***************** ICINGA2 NODE SETUP FINISHED **********************"

            # Init master_zones.conf
            log "GENERATE ZONES CONFIG"
            CONF_FILE="/opt/zones.d/master_zones.conf"
            /opt/zone-manager/zone-manager.sh generate_master_endpoint ${CONF_FILE} ${ZONE} ${COMMON_NAME} ${FULL_POD_NAME}
            rm -rf /etc/icinga2/zones.conf
            ln -s /opt/zones.d/master_zones.conf /etc/icinga2/zones.conf

            # Add curl into reload
            log "Add reload script to reload icinga2 config and restart icinga2 process"
            cat << 'EOF' > /usr/bin/reload
            icinga2 daemon -C > /dev/null 2>&1
            exit_code=$?
            if [[ $exit_code -eq 0 ]]; then
              echo "Valid icinga2 config"
            else
              echo "WARNING: Invalid icinga2 config, resolve the problem first"
              echo "Cancle restart!!!"
              exit 1
            fi
            url="https://localhost:5665/v1/actions/restart-process?pretty=1"
            curl -k -s -S -i -u "${ICINGA2_API_USER}:${ICINGA2_API_PASSWORD}" -H 'Accept: application/json' -X POST "$url"
            EOF

            # Add script to reload master
            log "Add reload script to reload masters"
            touch /usr/bin/reload-master
            chmod -R 775 /usr/bin/reload-master
            chown icinga:icinga /usr/bin/reload-master
            cat << 'EOF' > /usr/bin/reload-master
            echo 'Restarting master...'
            MASTER_LIST=$(dig srv +search +short icinga2-headless |awk '{print $4}' | uniq | sed 's/.$//g')
            for MASTER in ${MASTER_LIST}
            do
            url="https://${MASTER}:5665/v1/actions/restart-process?pretty=1"
            curl -k -s -S -i -u "${ICINGA2_API_USER}:${ICINGA2_API_PASSWORD}" -H 'Accept: application/json' -X POST "$url"
            done
            EOF

            # Add script to reload satellite
            log "Add reload script to reload satellites"
            touch /usr/bin/reload-satellite
            chmod -R 775 /usr/bin/reload-satellite
            chown icinga:icinga /usr/bin/reload-satellite
            cat << 'EOF' > /usr/bin/reload-satellite
            echo 'Restarting satellite...'
            SATELLITE_LIST=$(dig srv +search +short icinga2-satellite-headless |awk '{print $4}' | uniq | sed 's/.$//g')
            for SATELLITE in ${SATELLITE_LIST}
            do
            url="https://${SATELLITE}:5665/v1/actions/restart-process?pretty=1"
            curl -k -s -S -i -u "${ICINGA2_API_USER}:${ICINGA2_API_PASSWORD}" -H 'Accept: application/json' -X POST "$url"
            done
            EOF

            # Add script to force rebalance
            log "Add script to force rebalance"
            touch /usr/bin/rebalance
            chmod -R 775 /usr/bin/rebalance
            chown icinga:icinga /usr/bin/rebalance
            cat << 'EOF' > /usr/bin/rebalance
            echo 'Force rebalancing...'
            python3 /opt/SVTECH-Junos-Automation/module_utils/icinga2_rebalance.py --namespace=${NAMESPACE} --force-rebalance
            EOF

            # Check git folder
            log "Check git folder"
            check_git=`ls -la /opt/zones.d | grep ".git" | wc -l`
            if [[ $check_git -eq 0 ]]; then
              cd /opt/zones.d/ && \
              echo ".stversions" > .gitignore && \
              git init && \
              git config --global user.name icinga && \
              git config --global user.email icinga@localhost && \
              git add -A && git commit -m "init config"
              # Add curl into post-commit
              log "Add post-commit script to reload icinga2 config and restart icinga2 process"
              cat << 'EOF' > /opt/zones.d/.git/hooks/post-commit
            #!/bin/bash
            LINK="/etc/icinga2/zones.d"
            # Only restart if this node owns the active zones.d
            if [ ! -L "$LINK" ]; then
                echo "Not leader, skipping restart."
                exit 0
            fi
            TARGET=$(readlink -f "$LINK")
            if [ "$TARGET" != "/opt/zones.d" ]; then
                echo "zones.d points elsewhere, skipping."
                exit 0
            fi
            HOST=$(hostname)

            sleep 30

            url="https://${HOST}.icinga2-headless.${NAMESPACE}:5665/v1/actions/restart-process?pretty=1"
            curl -k -sS \
                -u "${ICINGA2_API_USER}:${ICINGA2_API_PASSWORD}" \
                -H "Accept: application/json" \
                -X POST "$url"
            EOF
            fi

            # Create host object for the endpoint
            log "Create host object for the endpoint ${COMMON_NAME} if not exists"
            if [[ ! -e "/opt/zones.d/master/${COMMON_NAME}.conf" ]]; then
            cat << EOF > /opt/zones.d/master/${COMMON_NAME}.conf
            object Host "${COMMON_NAME}" {
              import "generic-host-nms"
              check_command = "hostalive"
              address = "${FULL_POD_NAME}"
              address6 = "::1"
              vars.agent_endpoint = name
              vars.device_type = ""
              vars.os = "Linux"
              vars.disks["disk"] = {
              /* No parameters. */
              }
              vars.notification["mail"] = {
              groups = [ "icingaadmins" ]
              }
            }
            EOF
            fi

            # Create cronjob to sync icinga2.state file every 5 minutes
            crontab -l 2>/dev/null | echo "*/5 * * * * rsync -acz /var/lib/icinga2/icinga2.state /opt/SVTECH-Junos-Automation/${COMMON_NAME}.state 2>/dev/null" | crontab -
            cron -f &
            # copy existing state file if present
            if [[ -f /opt/SVTECH-Junos-Automation/${COMMON_NAME}.state ]]; then
              echo "Sync existing icinga2.state file from /opt/SVTECH-Junos-Automation/${COMMON_NAME}.state to /var/lib/icinga2/icinga2.state"
              /usr/bin/rsync -acz --ignore-existing /opt/SVTECH-Junos-Automation/${COMMON_NAME}.state /var/lib/icinga2/icinga2.state
            fi

            chmod 777 /opt/zones.d -R

            # Start election client in background
            log "Start election client in background"
            python3 /opt/election/election.py &

            echo "Start Icinga2:"
            exec /tini -- icinga2 daemon
          lifecycle:
            preStop:
              exec:
                command:
                - bash
                - -ec
                - |
                  log() {
                    echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
                  }
                  log "PreStop hook: Stopping icinga2 process gracefully. Removing its Endpoint object and zone membership from /opt/zones.d/master_zones.conf"
                  COMMON_NAME=${POD_NAME}
                  ZONE="master"
                  CONF_FILE="/opt/zones.d/master_zones.conf"
                  /opt/zone-manager/zone-manager.sh remove_endpoint ${CONF_FILE} ${ZONE} ${COMMON_NAME}
                  log "PreStop hook: Delete host object for the endpoint ${COMMON_NAME} if exists"
                  if [[ -e "/opt/zones.d/master/${COMMON_NAME}.conf" ]]; then
                    rm -f /opt/zones.d/master/${COMMON_NAME}.conf
                  fi
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: CHART_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/name']
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | quote }}
            - name: LEASE_NAME
              value: icinga2-master-config
            - name: OPT_ZONES_DIR
              value: /opt/zones.d
            - name: ETC_ZONES_DIR
              value: /etc/icinga2/zones.d
            - name: API_URL
              value: https://localhost:5665
            - name: TZ
              value: {{ include "common.timezone" ( dict "timezone" .Values.timezone "global" .Values.global) }}
            - name: ROLE
              value: master
            - name: COMMON_NAME
              value: master
            - name: ZONE
              value: master
            - name: ICINGA_HOST
              value: "0.0.0.0"
            - name: ICINGA_PORT
              value: "5665"
            - name: ICINGA2_API_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secret
                  key: icinga2-api-user
            - name: ICINGA2_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secret
                  key: icinga2-api-password
            {{- if .Values.master.ticketsalt }}
            - name: TICKET_SALT
              valueFrom:
                secretKeyRef:
                  name: ticketsalt-secret
                  key: ticketsalt
            {{- end }}
            - name: INFLUXDB_ENABLE
              value: {{ .Values.master.influxdb_connection.enable | quote }}
            {{- if .Values.master.influxdb_connection.enable }}
            - name: INFLUXDB_HOST
              value: {{ .Values.master.influxdb_connection.influxdb_host | quote }}
            - name: INFLUXDB_PORT
              value: {{ .Values.master.influxdb_connection.influxdb_port | quote}}
            - name: INFLUXDB_DATABASE
              value: {{ .Values.master.influxdb_connection.influxdb_database | quote }}
            - name: INFLUXDB_USER
              value: {{ .Values.master.influxdb_connection.influxdb_user | quote }}
            - name: INFLUXDB_PASSWORD
              value: {{ .Values.master.influxdb_connection.influxdb_password | quote }}
            {{- end }}
            {{- if .Values.master.ido_connection.enable }}
            - name: IDO_ENABLE
              value: {{ .Values.master.ido_connection.enable | quote }}
            - name: IDO_HOST
              value: {{ .Values.master.ido_connection.ido_host | quote }}
            - name: IDO_PORT
              value: {{ .Values.master.ido_connection.ido_port | quote}}
            - name: IDO_USER
              value: {{ .Values.master.ido_connection.ido_user | quote }}
            - name: IDO_PASSWORD
              value: {{ .Values.master.ido_connection.ido_password | quote }}
            - name: IDO_DATABASE
              value: {{ .Values.master.ido_connection.ido_database | quote }}
            - name: IDO_CATEGORIES
              value: {{ .Values.master.ido_connection.ido_catagories | quote}}
            - name: IDO_CLEANUP_STATEHISTORY
              value: {{ .Values.master.ido_connection.ido_cleanup_statehistory | quote }}
            - name: IDO_CLEANUP_NOTIFICAION
              value: {{ .Values.master.ido_connection.ido_cleanup_notificaion | quote }}
            - name: IDO_CLEANUP_SERVICECHECK
              value: {{ .Values.master.ido_connection.ido_cleanup_servicecheck | quote }}
            {{- end }}
            {{- if .Values.master.notifications.enable }}
            - name: NOTI_ENABLE
              value: {{ .Values.master.notifications.enable | quote }}
            - name: MAILHUB_HOST
              value: {{ .Values.master.notifications.mailhub_host | quote }}
            - name: MAILHUB_PORT
              value: {{ .Values.master.notifications.mailhub_port | quote }}
            - name: RELAY_EMAIL
              value: {{ .Values.master.notifications.relay_email | quote }}
            {{- end }}
            # Enable and config icingadb feature
            {{- if .Values.global.icingadb.enabled }}
            - name: ICINGADB_ENABLE
              value: {{ .Values.global.icingadb.enabled | quote }}
            - name: REDIS_HOST
              value: {{ .Values.global.redis.host | default "localhost" | quote }}
            - name: REDIS_PORT
              value: {{ .Values.global.redis.port | default "6379" | quote }}
            {{- end }}
          ports:
            - name: icinga2-api
              containerPort: {{ .Values.master.containerPorts.icinga2Api }}
              # protocol: TCP
            - name: livestatus
              containerPort: {{ .Values.master.containerPorts.livestatus }}
              # protocol: TCP
          {{- if .Values.master.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - |
                  icinga2 daemon -C
            initialDelaySeconds: {{ .Values.master.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.master.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.master.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.master.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.master.livenessProbe.failureThreshold }}
          {{- else if .Values.master.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.master.customLivenessProbe "context" $) | nindent 12 }}
          {{- end }}

          {{- if .Values.master.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -k -s -u "${ICINGA2_API_USER}:${ICINGA2_API_PASSWORD}" https://localhost:5665/v1
            initialDelaySeconds: {{ .Values.master.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.master.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.master.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.master.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.master.readinessProbe.failureThreshold }}
          {{- else if .Values.master.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.master.customReadinessProbe "context" $) | nindent 12 }}
          {{- end }}

          {{- if .Values.master.resources }}
          resources: {{- toYaml .Values.master.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            # shareVolume: VolumeMount
            {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
            {{- range .Values.global.sharedPersistenceVolume }}
            {{- if has "icinga2" .shareFor }}
            - name: {{ .volumeName }}
              mountPath: {{ .path }}
            {{- end }}
            {{- end }}
            {{- end }}
            # unshareVolume(volumeMount): define in the chart's values.yaml
            {{- if .Values.master.volumeMounts }}
            {{- toYaml .Values.master.volumeMounts | nindent 12 }}
            {{- end }}
        # redis container
        {{- if .Values.global.redis.enabled }}
        - name: redis
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.master.redis.image "global" .Values.global) }}
          {{- if .Values.master.redis.image.pullPolicy }}
          imagePullPolicy: {{ .Values.master.redis.image.pullPolicy }}
          {{- end}}
          {{- range $key, $value := .Values.master.redis.containerPort }}
          ports:
          - name: {{ $key }}
            containerPort: {{ $value }}
          {{- end}}
          ## ENV
          env:
          {{- range $key, $value := .Values.master.redis.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        {{- end }}
        # icingadb container
        {{- if .Values.global.icingadb.enabled }}
        - name: icingadb
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.master.icingadb.image "global" .Values.global) }}
          {{- if .Values.master.icingadb.pullPolicy }}
          imagePullPolicy: {{ .Values.master.icingadb.pullPolicy }}
          {{- end}}
          {{- range $key, $value := .Values.master.icingadb.containerPort }}
          ports:
          - name: {{ $key }}
            containerPort: {{ $value }}
          {{- end}}
          ## ENV
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          {{- include "icinga2-icingadb.conf" . | indent 10 }}
          {{- range $key, $value := .Values.master.icingadb.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          ## Config icingadb
          command:
            - /bin/bash
            - -c
            - |
              cat > /etc/icingadb/icingadb.conf << EOF
              database:
                host: $ICINGADB_DATABASE_HOST
                port: $ICINGADB_DATABASE_PORT
                database: $ICINGADB_DATABASE_DATABASE
                user: $ICINGADB_DATABASE_USER
                password: $ICINGADB_DATABASE_PASSWORD
              redis:
                host: $ICINGADB_REDIS_HOST
                port: $ICINGADB_REDIS_PORT


              retention:
                # Number of days to RETAIN FULL HISTORICAL data. By default, historical data is retained forever.
                history-days: $RETENTION_HISTORY_DAYS
                # Number of days to retain historical data for SLA reporting. By default, it is retained forever.
                sla-days: $RETENTION_SLA_DAYS

                # Map of history category to number of days to retain its data in order to
                # enable retention only for specific categories or to
                # override the number that has been configured in history-days.
                options:
                  acknowledgement: $RETENTION_OPTION_ACKNOWLEDGEMENT
                  comment: $RETENTION_OPTION_COMMENT
                  downtime: $RETENTION_OPTION_DOWNTIME
                  flapping: $RETENTION_OPTION_FLAPPING
                  notification: $RETENTION_OPTION_NOTIFICATION
                  state: $RETENTION_OPTION_STATE
              EOF
              /entrypoint
        {{- end }}
      {{- if .Values.init }}
      # init containers
      initContainers:
        - name: wait-for-init-repo
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.init.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
                until [ `ls -A /opt/SVTECH-Junos-Automation | grep 'completed' | wc -l` != 0 ];
                do
                  echo "Waiting for Init Repo...";
                  sleep 2;
                done
          volumeMounts:
          {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
            {{- range .Values.global.sharedPersistenceVolume }}

            {{- if and (eq .volumeName "automation-repo-volume") (has "icinga2" .shareFor) }}
            - name: {{ .volumeName }}
              mountPath: {{ .path }}
            {{- end }}

            {{- end }}
          {{- end  }}
      {{- if .Values.master.influxdb_connection.enable }}
        - name: wait-for-influxdb
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.init.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.master.influxdb_connection.influxdb_host }}
              until nc -zvw5 {{ .Values.master.influxdb_connection.influxdb_host }} 9096; do echo "Waiting for InfluxDB..."; sleep 2; done
              {{- else }}
              until nc -zvw5 influxdb-relay 9096; do echo "Waiting for InfluxDB..."; sleep 2; done
              {{- end }}
      {{- end }}

      {{- if .Values.master.ido_connection.enable }}
        - name: wait-for-mariadb
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.init.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.master.ido_connection.ido_host }}
              until nc -zvw5 {{ .Values.master.ido_connection.ido_host }} 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- else }}
              until nc -zvw5 mariadb 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- end }}
      {{- end }}

      {{- end }}

      imagePullSecrets:
      - name: ghcr-pull-secret

      volumes:
        # shareVolume(volume): define in the global values
        {{- if and .Values.global.sharedPersistenceVolume .Values.global.sharedVolume.enabled }}
        {{- range .Values.global.sharedPersistenceVolume }}
        {{- if has "icinga2" .shareFor }}
        - name: {{ .volumeName }}
          persistentVolumeClaim:
            claimName: {{ .pvcName }}
        {{- end }}
        {{- end }}
        {{- end }}
        # unshareVolume(volume): define in the chart's values.yaml
        {{- if .Values.master.volumes }}
        {{- toYaml .Values.master.volumes | nindent 8 }}
        {{- end }}
{{- end }}