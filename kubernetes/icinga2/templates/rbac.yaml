apiVersion: v1
kind: ServiceAccount
metadata:
 name: icinga2-master
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icinga2-config-master-election

rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icinga2-config-master-election

subjects:
  - kind: ServiceAccount
    name: icinga2-master
roleRef:
  kind: Role
  name: icinga2-config-master-election
  apiGroup: rbac.authorization.k8s.io