{{- if and (eq .Values.architecture "distribute") .Values.master.pdb.enabled }}
## Node drain / maintenance must not take both masters down at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "common.names.fullname" . }}-master
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: icinga2
spec:
  maxUnavailable: {{ .Values.master.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: icinga2
{{- end }}
