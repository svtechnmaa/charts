apiVersion: batch/v1
kind: Job
metadata:
  name: generate-cert
  labels:
    job-name: generate-cert
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        job-name: generate-cert
    spec:
      serviceAccountName: tls-job-sa
      containers:
        - name: generate-cert
          image: {{ include "common.images.image" ( dict "imageRoot" .Values.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.init.image.pullPolicy | quote }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              secret_name={{ .Values.tls.secretName | quote }}
              namespace={{ .Release.Namespace | quote }}
              work_dir=$(mktemp -d)
              trap 'rm -rf "$work_dir"' EXIT

              certificate=$(kubectl get secret "$secret_name" --namespace "$namespace" --ignore-not-found -o jsonpath='{.data.tls\.crt}')
              if [ -n "$certificate" ]; then
                printf '%s' "$certificate" | base64 -d > "$work_dir/tls.crt"
                if openssl x509 -in "$work_dir/tls.crt" -noout -checkend 604800; then
                  echo "TLS certificate has more than 7 days remaining; keeping existing Secret."
                  exit 0
                fi
                echo "TLS certificate expires in less than 7 days, is expired, or is invalid; rotating..."
              else
                echo "TLS Secret or certificate is missing; generating..."
              fi

              openssl req -x509 -nodes -days {{ .Values.tls.durationDays }} -newkey rsa:2048 -keyout "$work_dir/tls.key" -out "$work_dir/tls.crt" -subj "/CN={{ .Values.tls.commonName }}"
              kubectl create secret tls "$secret_name" --namespace "$namespace" --cert="$work_dir/tls.crt" --key="$work_dir/tls.key" --dry-run=client -o yaml > "$work_dir/secret.yaml"
              kubectl apply --namespace "$namespace" -f "$work_dir/secret.yaml"
      restartPolicy: Never
      imagePullSecrets:
      - name: ghcr-pull-secret
