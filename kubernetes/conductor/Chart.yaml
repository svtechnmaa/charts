apiVersion: v2
name: conductor
description: Conductor OSS durable workflow engine (server + UI) for the NMAA stack

# A chart can be either an 'application' or a 'library' chart.
type: application

# Chart version - bump on every change to this chart. CI packages and publishes it.
version: 0.5.0

# Version of Conductor OSS being deployed. Keep in lockstep with
# values.yaml image.tag and stacked_charts/images/svtech_conductor/Dockerfile.
appVersion: "3.31.0"

home: https://conductor-oss.github.io/conductor/
sources:
  - https://github.com/conductor-oss/conductor

dependencies:
  # svtech common library helpers. Must stay on 1.x.x - Bitnami common 2.x.x
  # conflicts with the vendored postgresql-ha chart below.
  - name: common
    repository: https://svtechnmaa.github.io/charts/artifacthub/
    version: 1.x.x

  # PostgreSQL 14 + repmgr + pgpool. Vendored as charts/postgresql-ha-9.4.6-svtech.tgz
  # (the repository URL below is not currently served - `helm dependency build` would
  # fail, so the tarball is committed, same as charts/common-1.4.3.tgz).
  # This variant intentionally ships NO pv.yaml; PersistentVolumes come from
  # templates/postgresql-pv.yaml in this chart.
  - name: postgresql-ha
    repository: https://svtechnmaa.github.io/charts/artifacthub/postgresql-ha
    version: 9.4.6-svtech
    condition: postgresqlHa.enabled
