{{/*
The whole Conductor properties file lives in a Secret because it embeds the datasource
password. It is mounted with subPath into /app/config/<file> and selected by the
CONFIG_PROP env var, which startup.sh turns into
  -DCONDUCTOR_CONFIG_FILE=/app/config/<file>
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-config" (include "common.names.fullname" .) }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Chart.Name }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ include "conductor.configFileName" . }}: |
    # Managed by the conductor Helm subchart - do not edit in-cluster.

    # ---- Execution store, queues, payload storage, search index: all PostgreSQL ----
    conductor.db.type=postgres
    conductor.queue.type=postgres
    conductor.external-payload-storage.type=postgres
    conductor.indexing.enabled=true
    conductor.indexing.type=postgres
    # Required so the server does not try to reach an Elasticsearch cluster.
    conductor.elasticsearch.version=0

    # ---- Datasource ----
    spring.datasource.url={{ include "conductor.jdbcUrl" . }}
    spring.datasource.username={{ .Values.postgresql.username }}
    spring.datasource.password={{ .Values.postgresql.password }}
    spring.datasource.hikari.maximum-pool-size={{ .Values.postgresql.maxPoolSize }}

    # ---- External payload storage ----
    # Same database as the datasource, set explicitly as netforge-be does (its offload path was
    # verified live on 3.31.0 with a 3.5 MB task output).
    conductor.external-payload-storage.postgres.url={{ include "conductor.jdbcUrl" . }}
    conductor.external-payload-storage.postgres.username={{ .Values.postgresql.username }}
    conductor.external-payload-storage.postgres.password={{ .Values.postgresql.password }}
    # Base URL embedded in the payload URIs handed to workers. Unset, it defaults to "" and an
    # offloaded payload (task input/output above 3 MB) reaches the worker as a relative URI it
    # cannot fetch.
    conductor.external-payload-storage.postgres.conductor-url={{ include "conductor.apiUrl" . }}

    # ---- Application behaviour ----
    conductor.app.ownerEmailMandatory={{ .Values.conductorConfig.ownerEmailMandatory }}
    conductor.app.systemTaskWorkerThreadCount={{ .Values.conductorConfig.systemTaskWorkerThreadCount }}
    conductor.app.taskExecutionPostponeDuration={{ .Values.conductorConfig.taskExecutionPostponeDuration }}
    loadSample={{ .Values.conductorConfig.loadSample }}
    {{- if .Values.lock.enabled }}

    # ---- Distributed lock (required when more than one server replica runs) ----
    conductor.workflow-execution-lock.type=redis
    conductor.app.workflowExecutionLockEnabled=true
    conductor.redis-lock.serverAddress={{ .Values.lock.redisUrl }}
    conductor.app.lockTimeToTry={{ .Values.lock.lockTimeToTry }}
    {{- end }}
    {{- if .Values.conductorConfig.metricsPrometheus }}

    # ---- Observability: metrics at :8080/actuator/prometheus, health at :8080/health ----
    conductor.metrics-prometheus.enabled=true
    management.endpoints.web.exposure.include=health,info,prometheus
    {{- end }}
    {{- if .Values.conductorConfig.extraProperties }}

    # ---- extraProperties ----
    {{- range .Values.conductorConfig.extraProperties }}
    {{ . }}
    {{- end }}
    {{- end }}
