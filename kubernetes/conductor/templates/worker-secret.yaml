{{- if and .Values.worker.enabled (not .Values.worker.icinga2.existingSecret) }}
{{/*
The worker's icinga2 API password, read by worker-deployment.yaml with secretKeyRef so the
Deployment spec does not carry it. Not rendered when worker.icinga2.existingSecret names a
Secret created outside the chart.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor.worker.secretName" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: conductor-worker
type: Opaque
stringData:
  ICINGA2_API_PASSWORD: {{ .Values.worker.icinga2.apiPassword | toString | quote }}
{{- end }}
