# ── Persistence: Postgres-only (spec D2/D3), dedicated instance (P1) ─────
# P0 found ~685 commits/sec idle queue-poll churn landing on the shared
# app postgres -- P1 moves Conductor to its own `conductor-postgres` service.
conductor.db.type=postgres
conductor.queue.type=postgres
spring.datasource.url=${CONDUCTOR_DB_URL:jdbc:postgresql://conductor-postgres:5432/conductor}
spring.datasource.username=${CONDUCTOR_DB_USERNAME:conductor}
spring.datasource.password=${CONDUCTOR_DB_PASSWORD:conductor_pass}

# ── Indexing in Postgres, Elasticsearch OFF ─────────────────────
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0

# ── External payload storage: postgres baseline (spec D4 fallback-first) ──
conductor.external-payload-storage.type=postgres
conductor.external-payload-storage.postgres.url=${CONDUCTOR_DB_URL:jdbc:postgresql://conductor-postgres:5432/conductor}
conductor.external-payload-storage.postgres.username=${CONDUCTOR_DB_USERNAME:conductor}
conductor.external-payload-storage.postgres.password=${CONDUCTOR_DB_PASSWORD:conductor_pass}
# Base URL embedded in payload URIs handed to clients. Was http://localhost:8080
# ("PoC worker runs on the host") -- B3 task 3: the worker is now its own
# container (netforge-conductor-worker-1), where localhost:8080 resolves to
# itself, not to Conductor. Fixed to the in-network service name/port from
# docker-compose.yml (`conductor:8080`, same address CONDUCTOR_API_URL already
# uses for the client side).
conductor.external-payload-storage.postgres.conductor-url=http://conductor:8080

# ── Offload thresholds, in KB — B3 task 3: raised to Conductor's own OSS
# defaults (byte-verified against ConductorProperties.class in this exact
# conductor-server-3.31.0.jar, same decompile approach as the retention note
# below), replacing the 10KB-across-the-board P0 experiment values ("defaults
# are 3072/10240 -- low for P0 V3"). That comment conflated the two real
# defaults: task thresholds default to 3072KB, workflow thresholds to 5120KB
# (the 10240KB figure is actually the separate *hard* Max*PayloadSizeThreshold
# ceiling, left at its own default and not touched here). Effect: ordinary
# node outputs (well under 3MB) no longer offload at all, so the wrong-URL
# latent bug in the setting above stops mattering for the common case --
# fixed anyway per the task brief, because the next person to raise a payload
# size will not think to check it. Offload can still legitimately trigger for
# a genuinely large payload: verified live (2026-08-20) with a 3.5MB task
# output, which externalized to conductor-postgres' `external.external_payload`
# table and completed normally -- see task-34-report.md Step 2 for the trace.
conductor.app.taskInputPayloadSizeThreshold=3072
conductor.app.taskOutputPayloadSizeThreshold=3072
conductor.app.workflowInputPayloadSizeThreshold=5120
conductor.app.workflowOutputPayloadSizeThreshold=5120

# ── Misc ────────────────────────────────────────────────────────
loadSample=false
conductor.metrics-prometheus.enabled=false

# ── Retention (B3 task 2) ──────────────────────────────────────────────────
# Decision: 30 days, on Conductor's own archival/sweeper, not reimplemented in
# NetForge. VERIFIED (byte-decompiled conductor-server.jar 3.31.0 shipped in this
# exact image, cross-checked against the running server's default
# BOOT-INF/classes/application.properties and its live /api behaviour) that for
# THIS deployment's persistence combination -- conductor.db.type=postgres,
# conductor.indexing.type=postgres, no Elasticsearch, no S3 -- no such config
# property exists:
#   - ConductorProperties (conductor.app.*, exhaustive getter/setter scan): no
#     archival/retention/ttl/purge field. "sweeper" there is the workflow-decide
#     sweeper (re-evaluates running workflows), not a history janitor.
#   - PostgresProperties (postgres persistence, exhaustive scan): no such field
#     either.
#   - PostgresIndexDAO.searchArchivableWorkflows literally throws
#     "...is not supported for postgres indexing" -- the ES-era archival search
#     the OSS "sweeper" needs to find candidates does not work on this backend.
#   - The one real archival feature that exists (`ArchivingWorkflowListenerProperties`,
#     prefix `conductor.workflow-status-listener.archival.*`) pushes terminal
#     workflows to S3 after a fixed delaySeconds -- it requires an AWS S3 bucket and
#     has no day-granularity retention concept; not applicable without S3.
#   - The Orkes-flavoured "scheduler archival" properties found in the jar
#     (`conductor.scheduler.redis.archival-ttl-days`, etc.) govern the CRON-SCHEDULE
#     feature's own execution-history bookkeeping, a different subsystem NetForge
#     does not use (schedules run through this project's own APScheduler).
# So there is no property to set here that Conductor will actually honour for
# "delete/archive a workflow instance N days after it finishes" -- adding one
# anyway (e.g. copied from newer-Conductor docs) is exactly the silently-ignored,
# looks-done-but-isn't outcome this task was told to avoid.
# ASSUMED, not verified against a real bucket: the S3 listener's practical
# behaviour end-to-end (only its config-property surface and precondition were
# read from bytecode).
# The concrete cleanup mechanism actually available on this server is the REST
# bulk API (`WorkflowBulkResource` / `POST /api/workflow/bulk/...`, backed by
# `WorkflowBulkServiceImpl.deleteWorkflow`) -- callable by an external, Conductor-
# native script/cron against completed instances older than 30 days. That is an
# operational job outside this task's file scope (compiler.py/dispatcher.py/
# workflow_engine.py untouched, no new compose service), so it is not implemented
# here; flagging it for a follow-up task. See task-2-report.md for the full
# verification trail.
