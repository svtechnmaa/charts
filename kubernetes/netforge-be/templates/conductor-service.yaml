{{- if .Values.conductor.enabled }}
{{- $conductorName := printf "%s-conductor" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: Service
metadata:
  name: conductor
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $conductorName }}
spec:
  type: {{ .Values.conductor.service.type }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $conductorName }}
  ports:
    {{- range .Values.conductor.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- end }}
