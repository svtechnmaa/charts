{{- if .Values.netforgeAppSecretEnv }}
{{- $netforgeAppSecretName := printf "%s-secret-env" .Chart.Name | trunc 63 | trimSuffix "-" }}
{{- $fernetKey := index .Values.netforgeAppSecretEnv "FERNET_KEY" | default "" | toString }}
{{- if empty $fernetKey }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $netforgeAppSecretName }}
  {{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "FERNET_KEY") }}
    {{- $fernetKey = index $existingSecret.data "FERNET_KEY" | b64dec }}
  {{- else }}
    {{- /* randBytes returns Base64; translate it to Fernet's URL-safe alphabet. */}}
    {{- $fernetKey = randBytes 32 | replace "+" "-" | replace "/" "_" }}
  {{- end }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}=$" $fernetKey) }}
  {{- fail "netforgeAppSecretEnv.FERNET_KEY must be a valid 32-byte URL-safe Base64 Fernet key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $netforgeAppSecretName }}
type: Opaque
data:
  {{- range $key, $val := .Values.netforgeAppSecretEnv }}
  {{- if eq $key "FERNET_KEY" }}
  {{ $key }}: {{ $fernetKey | b64enc | quote }}
  {{- else }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
