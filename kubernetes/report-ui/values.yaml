global:
  imageRegistry: ghcr.io
  frontendVip: "" # VIP for frontend service

timezone: Asia/Ho_Chi_Minh

backend:
  replicaCount: 2
  init:
    image:
      registry: ghcr.io
      repository: svtechnmaa/busybox
      tag: 1.33
      pullPolicy: IfNotPresent
  image:
    registry: ghcr.io
    repository: svtechnmaa/svtech_report
    tag: v1.2.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    # loadBalancerIP:
    # loadBalancerSourceRanges:
    # - 10.10.10.0/24
    # clusterIP: None
  config:
    basehref: ""        # Base href for the application, e.g., "/minedu"
    db_user: reflex
    db_password: reflex
    db_host: mariadb
    db_database: svtech_report
    grafana_url: http://grafana:3000/grafana
    icinga_redis_db: "0"
    icinga_redis_host: icinga2
    icinga_redis_port: "6379"
    icingadb_database: icingadb
    icingadb_host: mariadb
    icingadb_password: juniper@123
    icingadb_port: "3306"
    icingadb_user: icingadb
    influxdb_database: influxdb_nms
    influxdb_host: influxdb
    influxdb_password: juniper@123
    influxdb_port: "8086"
    influxdb_user: juniper
    seaweedfs_url: http://seaweedfs-filer.seaweedfs.svc.cluster.local:8888
    task_failure_ttl: "3600"
    task_result_ttl: "3600"
    task_timeout: "3600"
    timeout: "600"
    worker: "5"
    worker_lifetime: "600"
    use_granian: "True"  # Set to "True" to use Granian, "False" otherwise
    rate_limit_times: "100"
    rate_limit_seconds: "10"
    max_concurrent_sessions: "100"
    icinga_semaphore: "10"

scheduler:
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: svtechnmaa/svtech_report
    tag: v1.2.1
    pullPolicy: IfNotPresent

worker:
  replicaCount: 2
  image:
    registry: ghcr.io
    repository: svtechnmaa/svtech_report
    tag: v1.2.1
    pullPolicy: IfNotPresent

redis:
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: svtechnmaa/redis
    tag: 7.2.3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    # loadBalancerIP:
    # loadBalancerSourceRanges:
    # - 10.10.10.0/24
    # clusterIP: None

dashboard:
  enabled: true
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: svtechnmaa/rq-dashboard
    tag: 0.8.5
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9181
    # loadBalancerIP:
    # loadBalancerSourceRanges:
    # -10.10.10.0/24
    # clusterIP: None

nameOverride: ""
fullnameOverride: ""

commonLabels: {}
