apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Chart.Name }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  name: {{ include "common.names.fullname" . }}
spec:
  replicas: {{ include "common.replicas" ( dict "replicaCount" .Values.backend.replicaCount "global" .Values.global ) }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Chart.Name }}
    spec:
      initContainers:
        - name: wait-for-mariadb
          image: {{ include "common.images.image" (dict "imageRoot" .Values.backend.init.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.backend.init.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.backend.config.db_host }}
              until nc -zvw5 {{ .Values.backend.config.db_host }} 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- else }}
              until nc -zvw5 mariadb 3306; do echo "Waiting for MariaDB..."; sleep 2; done
              {{- end }}
      containers:
      - image: {{ include "common.images.image" ( dict "imageRoot" .Values.backend.image "global" .Values.global) }}
        {{- if .Values.backend.image.pullPolicy }}
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        {{- end }}
        name: reflex
        command:
          - bash
          - -ec
          - |
            {{- if not (empty .Values.backend.config.basehref) }}
            while IFS= read -r file; do
              sed -i "s|/report/logo|{{ .Values.backend.config.basehref }}/report/logo|g" "$file"
            done < <(grep -rl "/report/logo" . || true)
            {{- end }}
            if [ -d alembic ]; then
              reflex db migrate
            fi
            reflex run --env prod
        env:
          - name: TZ
            value: {{ include "common.timezone" ( dict "timezone" .Values.timezone "global" .Values.global) }}
        ports:
        - containerPort: 3000
          name: {{ .Chart.Name }}
        volumeMounts:
        - name: report-ui-env
          mountPath: /app/.env
          subPath: .env
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 30
      volumes:
      - name: report-ui-env
        secret:
          secretName: {{ include "common.names.fullname" . }}-env
      imagePullSecrets:
      - name: ghcr-pull-secret
