{{- $basehref := .Values.backend.config.basehref | default "" -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-fe-ingress
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: {{ .Release.Name }}
  rules:
  - http:
      paths:
      # Main application path
      - path: "{{ $basehref }}/report/"
        pathType: Prefix
        backend:
          service:
            name: {{ .Chart.Name }}
            port:
              number: {{ .Values.backend.service.port }}
              
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  name: {{ .Chart.Name }}-be-ingress
spec:
  ingressClassName: {{ .Release.Name }}
  rules:
  - http:
      paths:
      - backend:
          service:
            name: {{ .Chart.Name }}
            port:
              number: {{ .Values.backend.service.port }}
        path: "{{ $basehref }}/(_event|ping|_upload|_health|graphql|pingtrace)(/.*)?$"
        pathType: ImplementationSpecific

