######### LATEST COMMIT: 524d4704673c14454c66f10d90d02d45830d9c80 #########
global:
  imageRegistry: ""
  backendVip: "" # <= Auto-assign with metalLB (Always set to empty string)
  frontendVip: "" # <= Auto-assign with metalLB or set your own IP
  enableHttps: false # <= Set to true if you want to enable HTTPS
  grafana-embed:
    subPath: "/speedtest/grafana"
  speedtest:
    runInitDataJob: true # <= Set to true if you want to run the init data job
######################################################
timezone: Asia/Ho_Chi_Minh
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
imagePullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
######################################################  
replicaCounts:
  django: 1
  frontend: 1
  testerServer: 1
  mqttLogger: 1
  djangoStatic: 1
  scheduler: 1
  worker: 1
  reportExportWorker: 1
#####################################################
image:
  django:
    registry: ghcr.io
    repository: svtechnmaa/speedtester_backend
    tag: 2.1.5
  frontend:
    registry: ghcr.io
    repository: svtechnmaa/speedtester_frontend
    tag: 2.1.7
  testerServer:
    registry: ghcr.io
    repository: svtechnmaa/tester_server
    tag: 2.0.34_dev
  scheduler:
    registry: ghcr.io
    repository: svtechnmaa/speedtest_scheduler
    tag: 1.0.14_dev
  mqttLogger:
    registry: ghcr.io
    repository: svtechnmaa/speedtester_mqtt_logger
    tag: 2.1.0
  worker:
    registry: ghcr.io
    repository: svtechnmaa/speedtest_scheduler
    tag: 1.0.14_dev
  nginx:
    registry: ghcr.io
    repository: svtechnmaa/nginx
    tag: 1.22.0
  initWaitDb:
    registry: ghcr.io
    repository: svtechnmaa/busybox
    tag: 1.33
#####################################################
pvc:
  static:
    claimName: "" # Release-specific default; retain the previous name explicitly on upgrade.
    storageClass: seaweedfs-storage
    size: 50Mi
  media:
    claimName: "" # Release-specific default; retain the previous name explicitly on upgrade.
    storageClass: seaweedfs-storage
    size: 300Mi
  backupDb:
    claimName: "" # Release-specific default; retain the previous name explicitly on upgrade.
    storageClass: seaweedfs-storage
    size: 2Gi
  mqttLogs:
    claimName: "" # Release-specific default; retain the previous name explicitly on upgrade.
    storageClass: seaweedfs-storage
    size: 1Gi
####################################################
# Each credential accepts a Secret name or {name, keyMapping}.
# Missing mapping entries fall back to existingSecretPasswordKey.
# Change this if you use a different service/IP
db:
  auth:
    username: "speedtest"
    password: "" # External DB: provide its password or an existing Secret.
    existingSecret: ""
    existingSecretPasswordKey: DB_PASSWORD
  name: "speedtest"
  host: "mariadb" # <= Change this to your MariaDB service name
  port: "3306"
####################################################
# Change this if you use a different service/IP
mqtt:
  auth:
    username: "admin"
    password: "" # External broker: prefer the Secret owned by EMQX or the stack.
    existingSecret: ""
    existingSecretPasswordKey: MQTT_BROKER_PASSWORD
  brokerHost: "emqx-listeners" # <= Change this to your MQTT broker service name or IP
  brokerPort: "8083"
  maxConcurrency: 10
  brokerPath: "/speedtest/ws-ep" # Must match brokerWs path of emqx
vite:
  mqttBrokerPort: "80" #<= Change to "443" if using secure WebSocketSecure
  mqttBrokerProtocol: "ws" # <= Change to "wss" if using secure WebSocketSecure
  mqttBrokerPath: "/speedtest/ws-ep" # Must match brokerWs path of emqx
  mqttBrokerHost: "" # <= Leave empty to use the browser page hostname (application fallback)
  defaultLang: "en"
#####################################################
django:
  auth:
    username: ""
    password: "" # Empty will generates a stable password.
    existingSecret: ""
    existingSecretPasswordKey: DJANGO_SUPERUSER_PASSWORD
  dbEngine: "mariadb"
  superUserEmail: ""
  allowedHosts: "*"
  staticRoot: "/app/static/"
  mediaRoot: "/app/media/"
  chromeUrl: "http://chrome:9222"
  csrfTrustedOrigins: "" # <= Comma-separated origins for your frontendVip or domain
  tenantDbNames: "" # <= Comma separated list of tenant database names if using multi-tenancy
  reportChartFrontendBaseUrl: "" # <= Defaults to http(s)://<global.frontendVip><paths.userPortal> when left empty
  reportChartBackendBaseUrl: "" # Optional separate backend cookie origin for report export; empty uses only the frontend origin
  reportChartScreenshotTimeoutMs: "30000"
  reportChartScreenshotSettleDelayBaseMs: "1000"
  reportChartScreenshotSettleDelayPerChartMs: "500"
  reportChartScreenshotTheme: "light"
  reportExportJobTimeoutSeconds: "14400"
  reportExportFileTtlSeconds: "604800"
  reportExportStaleHeartbeatSeconds: "900"
  reportExportPdfRenderTimeoutMs: "60000"
  reportExportPdfSettleDelayMs: "2000"
  reportExportPdfRenderBatchSize: "5"
  reportExportPdfRenderAttempts: "3"
  reportExportMaintenanceSchedule: "*/15 * * * *"
  numWorkers: "3" # <= Uvicorn worker processes;
  reportExportNumWorkers: "2" # <= Uvicorn worker processes;
#####################################################
worker:
  numWorkers: 3
#####################################################
redis:
  host: "redis"
  port: "6379"
#####################################################
paths: # This can be used to change the paths of the admin and user portals, can only change speedtest to something else
  adminPortal: "/speedtest/admin/"
  userPortal: "/speedtest/"
  staticDjango: "/speedtest/static"
  mediaDjango: "/speedtest/media"
  backendApi: "/speedtest/api/"
  backendGraphQl: "/speedtest/graphql/"
  speedtestServer: "/speedtest/server/default"

# Normal, single-Pod Job. Workloads wait for this release's completion marker.
migration:
  markerHistory: 5 # Keep this many recent revision markers on the private backup PVC.
  waitTimeoutSeconds: 1800
  activeDeadlineSeconds: 1800
  backoffLimit: 1

backup:
  schedule: "0 2 * * *"
  retentionDays: 45
purgeRetention:
  schedule: "0 3 * * *"
