global:
  backendVip: "" # <= Auto-assign with metalLB (Always set to empty string)
  frontendVip: "10.98.98.110" # <= Auto-assign with metalLB or set your own IP
  ingress-nginx:
    enabled: true
  runInitDataJob: false # <= Set to true if you want to run the init data job
  enableHttps: false # <= Set to true if you want to enable HTTPS
######################################################
emqx:
  persistence:
    storageClass: seaweedfs-storage
    size: 1Gi
######################################################  
replicaCount:
  django: 1
  frontend: 1
  nginx: 1
  subscribeResult: 1
  testerServer: 1
  chromium: 1
  mqttLogger: 1
  mariadb: 1
  scheduler: 1
  worker: 1
  reportExportWorker: 1
  grafanaUi: 1
  grafanaEmbed: 1
  grafanaMariadb: 1
#####################################################
image:
  django:
    repository: ghcr.io/svtechnmaa/speedtester_backend
    tag: 2.1.4
  frontend:
    repository: ghcr.io/svtechnmaa/speedtester_frontend
    tag: 2.1.7
  testerServer:
    repository: ghcr.io/svtechnmaa/tester_server
    tag: 2.0.1
  scheduler:
    repository: ghcr.io/svtechnmaa/speedtest_scheduler
    tag: 1.0.4
  nginx: nginx:latest
  mariadb: mariadb:latest
  redis: redis:latest
  mqttLogger:
    repository: ghcr.io/svtechnmaa/speedtester_mqtt_logger
    tag: 2.1.0
  worker:
    repository: ghcr.io/svtechnmaa/speedtest_scheduler
    tag: 1.0.4
pvc:
  static:
    claimName: static-pvc
    storageClass: seaweedfs-storage
    size: 100Mi
  media:
    claimName: media-pvc
    storageClass: seaweedfs-storage
    size: 1Gi
  frontendDist:
    claimName: frontend-dist-pvc
    storageClass: seaweedfs-storage
    size: 100Mi
  mariadb:
    claimName: mariadb-pvc
    storageClass: seaweedfs-storage
    size: 1Gi
  backupDb:
    claimName: backup-db-pvc
    storageClass: seaweedfs-storage
    size: 2Gi
  mqttLogs:
    claimName: mqtt-logs-pvc
    storageClass: seaweedfs-storage
    size: 1Gi
  redisData:
    claimName: redis-data-pvc
    storageClass: seaweedfs-storage
    size: 1Gi
  grafanaMariadb:
    claimName: grafana-mariadb-pvc
    storageClass: seaweedfs-storage
    size: 1Gi
####################################################
# Change this if you use a different service/IP
db:
  enable: true # <= Set to false and change this section below to use the external MariaDB database
  name: "speedtest"
  user: "speedtest"
  password: "speedtest@123"
  host: "mariadb.speedtest-staging.svc.cluster.local" # <= Change this to your MariaDB service name
  port: "3306"
  rootPassword: "root@$123" # <= Change this to your MariaDB root password
####################################################
# Change this if you use a different service/IP
mqtt:
  brokerHost: "emqx-listeners.speedtest-staging.svc.cluster.local" # <= Change this to your MQTT broker service name or IP
  brokerPort: "8083"
  username: "admin"
  password: "" # <= Change this to your MQTT broker password
  maxConcurrency: 10
  brokerPath: "/speedtest/ws-ep" # Must match paths.brokerWs
vite:
  mqttBrokerPort: "80" #<= Change to "443" if using secure WebSocketSecure
  mqttBrokerProtocol: "ws" # <= Change to "wss" if using secure WebSocketSecure
  mqttBrokerPath: "/speedtest/ws-ep" # Must match paths.brokerWs
  mqttBrokerHost: "" # <= Leave empty to use the global frontendVip
  defaultLang: "en"
#####################################################
django:
  dbEngine: "mariadb"
  superUserUsername: "admin"
  superUserEmail: "admin@example.com"
  superUserPassword: "admin@123"
  allowedHosts: "*"
  staticRoot: "/app/static/"
  mediaRoot: "/app/media/"
  csrfTrustedOrigins: "https://10.98.98.110" # <= Comma-separated origins for your frontendVip or domain
  tenantDbNames: "" # <= Comma separated list of tenant database names if using multi-tenancy
  reportChartFrontendBaseUrl: "" # <= Defaults to http(s)://<global.frontendVip><paths.userPortal> when left empty
  reportChartBackendBaseUrl: ""
  reportChartScreenshotTimeoutMs: "30000"
  reportChartScreenshotSettleDelayBaseMs: "1000"
  reportChartScreenshotSettleDelayPerChartMs: "500"
  reportChartScreenshotTheme: "light"
  reportExportJobTimeoutSeconds: "14400"
  reportExportFileTtlSeconds: "604800"
  reportExportStaleHeartbeatSeconds: "900"
  reportExportPdfRenderTimeoutMs: "60000"
  reportExportPdfSettleDelayMs: "2000"
  reportExportPdfRenderBatchSize: "5"
  reportExportPdfRenderAttempts: "3"
  reportExportMaintenanceSchedule: "*/15 * * * *"
#####################################################
worker:
  numWorkers: 3
#####################################################
redis:
  host: "redis.speedtest-staging.svc.cluster.local"
  port: "6379"
  enableAOF: true
#####################################################
redisinsight:
  enabled: false
  port: 15540
#####################################################
grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin@123
  rootUiUrl: http://10.98.98.110/speedtest/grafana/
  rootEmbedUrl: http://10.98.98.110/speedtest/embed-grafana/
  servicePort: 80
  serveFromSubPath: true
  anonymous: false
  plugins: "marcusolsson-dynamictext-panel"
  database:
    enabled: true
    type: mysql
    host: grafana-mariadb.speedtest-staging.svc.cluster.local
    port: "3306"
    name: speedtestgrafana
    user: speedtestgrafana
    password: speedtestgrafana@123
    rootPassword: speedtestgrafana@123
    sslMode: disable
#####################################################
chromium:
  enabled: false # <= Set to true to enable the Chromium deployment
#####################################################
paths: # This can be used to change the paths of the admin and user portals, can only change speedtest to something else
  adminPortal: "/speedtest/admin/"
  userPortal: "/speedtest/"
  staticDjango: "/speedtest/static"
  mediaDjango: "/speedtest/media"
  backendApi: "/speedtest/api/"
  backendGraphQl: "/speedtest/graphql/"
  brokerWs: "/speedtest/ws-ep"
  brokerWss: "/speedtest/wss-ep"
  speedtestServer: "/speedtest/server/default"
  emqxDashboard: "/speedtest/emqx/"
  grafanaPath: "/speedtest/grafana/"
  grafanaEmbedPath: "/speedtest/embed-grafana/"git 