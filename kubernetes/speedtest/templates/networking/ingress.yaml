apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: ingress
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/client_max_body_size: "0"
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.global.enableHttps | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.global.enableHttps | quote }}
    nginx.ingress.kubernetes.io/preserve-trailing-slash: 'true'
spec:
  ingressClassName: {{ .Release.Name }}
  rules:
    - http:
        paths:
          - path: {{ .Values.paths.staticDjango }}
            pathType: Prefix
            backend:
              service:
                name: django-static-service
                port:
                  number: 80
          - path: {{ .Values.paths.mediaDjango }}
            pathType: Prefix
            backend:
              service:
                name: django-static-service
                port:
                  number: 80
          - path: {{ .Values.paths.adminPortal }}
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 80
          - path: {{ .Values.paths.backendApi }}
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 80
          - path: {{ .Values.paths.backendGraphQl }}
            pathType: Prefix
            backend:
              service:
                name: django-service
                port:
                  number: 80
          - path: {{ .Values.paths.userPortal }}
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: {{ .Values.paths.speedtestServer }}
            pathType: Prefix
            backend:
              service:
                name: tester-service
                port:
                  number: 80
