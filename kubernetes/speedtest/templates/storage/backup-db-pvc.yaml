apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "speedtest.pvcName" (dict "group" "backupDb" "context" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: backup-db
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.pvc.backupDb.accessModes }}
  resources:
    requests:
      storage: {{ .Values.pvc.backupDb.size }}
  storageClassName: {{ .Values.pvc.backupDb.storageClass }}
