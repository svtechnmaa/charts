apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}-mqtt-logger
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-logger
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "common.replicas" (dict "replicaCount" .Values.replicaCounts.mqttLogger "global" .Values.global) }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqtt-logger
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: mqtt-logger
        {{- if .Values.commonLabels }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: mqtt-logger
          image: {{ include "common.images.image" (dict "imageRoot" .Values.image.mqttLogger "global" .Values.global) }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          env:
            - name: MAX_CONCURRENT_PER_SERVER
              value: {{ .Values.mqtt.maxConcurrency | quote }}
            - name: MQTT_BROKER_HOST
              value: {{ .Values.mqtt.brokerHost | quote }}
            - name: MQTT_BROKER_PORT
              value: {{ .Values.mqtt.brokerPort | quote }}
            - name: MQTT_BROKER_PATH
              value: {{ .Values.mqtt.brokerPath | quote }}
            - name: MQTT_BROKER_USERNAME
              value: {{ .Values.mqtt.username | quote }}
            - name: MQTT_BROKER_PASSWORD
              value: {{ .Values.mqtt.password | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DB
              value: "0"
          volumeMounts:
            - name: logs-volume
              mountPath: "/app/logs"
      volumes:
        - name: logs-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.mqttLogs.claimName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
