{{- if .Values.chromium.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromium-deployment
spec:
  replicas: {{ .Values.replicaCount.chromium }}
  selector:
    matchLabels:
      app: chromium
  template:
    metadata:
      labels:
        app: chromium
    spec:
      containers:
        - name: chromium
          image: zenika/alpine-chrome:latest
          command:
            - chromium-browser
          args:
            - --headless
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
          ports:
            - containerPort: 9222
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
{{- end }}