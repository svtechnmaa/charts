{{/* Fail on retired credential paths rather than silently use another account. */}}
{{- if hasKey .Values.db "user" }}
{{- fail "Move db.user to db.auth.username" }}
{{- end }}
{{- if hasKey .Values.db "password" }}
{{- fail "Move db.password to db.auth.password" }}
{{- end }}
{{- if hasKey .Values.db "existingSecret" }}
{{- fail "Move db.existingSecret to db.auth.existingSecret" }}
{{- end }}
{{- if hasKey .Values.db "existingSecretPasswordKey" }}
{{- fail "Move db.existingSecretPasswordKey to db.auth.existingSecretPasswordKey" }}
{{- end }}
{{- if hasKey .Values.mqtt "username" }}
{{- fail "Move mqtt.username to mqtt.auth.username" }}
{{- end }}
{{- if hasKey .Values.mqtt "password" }}
{{- fail "Move mqtt.password to mqtt.auth.password" }}
{{- end }}
{{- if hasKey .Values.mqtt "existingSecret" }}
{{- fail "Move mqtt.existingSecret to mqtt.auth.existingSecret" }}
{{- end }}
{{- if hasKey .Values.mqtt "existingSecretPasswordKey" }}
{{- fail "Move mqtt.existingSecretPasswordKey to mqtt.auth.existingSecretPasswordKey" }}
{{- end }}
{{- if hasKey .Values.django "superUserUsername" }}
{{- fail "Move django.superUserUsername to django.auth.username" }}
{{- end }}
{{- if hasKey .Values.django "password" }}
{{- fail "Move django.password to django.auth.password" }}
{{- end }}
{{- if hasKey .Values.django "existingSecret" }}
{{- fail "Move django.existingSecret to django.auth.existingSecret" }}
{{- end }}
{{- if hasKey .Values.django "existingSecretPasswordKey" }}
{{- fail "Move django.existingSecretPasswordKey to django.auth.existingSecretPasswordKey" }}
{{- end }}
