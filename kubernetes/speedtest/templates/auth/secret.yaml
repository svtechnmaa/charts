{{- if dig "auth" "existingSecret" "" .Values.AsMap }}
{{- fail "auth.existingSecret was split into db/mqtt/django.auth.existingSecret and existingSecretPasswordKey; see README migration guide" }}
{{- end }}
{{- range $group := list "db" "mqtt" "django" }}
{{- $config := (index $.Values $group).auth }}
{{- $ref := dict "group" $group "context" $ }}
{{- $name := include "speedtest.credentialSecretName" $ref }}
{{- $key := include "speedtest.credentialSecretKey" $ref }}
{{- if not $config.existingSecret }}
{{- $password := tpl (default "" $config.password | toString) $ }}
{{- if eq $group "django" }}
{{- $users := default dict $.Values.global.authenUsers }}
{{- $django := default dict $users.django }}
{{- $globalPassword := tpl (default "" $django.password | toString) $ }}
{{- $password = default $password $globalPassword }}
{{- else }}
{{/* External services own their accounts; validate the rendered password. */}}
{{- $_ := required (printf "%s.auth.password or %s.auth.existingSecret is required; this chart does not provision the external service account" $group $group) $password }}
{{- end }}
{{/* Normalize only this credential in a private Values copy. Never mutate shared
     values or render a password already retrieved from an existing Secret. */}}
{{- $passwordContext := merge (dict "Values" (deepCopy $.Values)) $ }}
{{- $_ := set (index $passwordContext.Values $group).auth "password" $password }}
{{- $paths := list (printf "%s.auth.password" $group) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $group }}-auth
    {{- with $.Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $key | quote }}: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" $key "providedValues" $paths "length" 32 "context" $passwordContext) }}
{{- end }}
{{- end }}
