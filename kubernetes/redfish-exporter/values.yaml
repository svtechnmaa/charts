# # Global values
# global:
#   imageRegistry: ghcr.io
#   imagePullSecrets: abc
#   timezone: Asia/Ho_Chi_Minh
# Default values for sample-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Change workloadType to Deployment, DaemonSet, or StatefulSet
workloadType: Deployment
# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# init image
init:
  image:
    registry: ghcr.io/svtechnmaa
    repository: busybox
    tag: 1.33
    pullPolicy: IfNotPresent

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: ghcr.io
  repository: svtechnmaa/redfish-exporter
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.2.1"
  pullSecret: "ghcr-pull-secret" # This is the name of the secret to use for pulling the image, if required.


# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Labels and annotations
commonLabels: {}
commonAnnotations: {}
#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  nodePortEnabled: false # set to true if using NodePort and you want to specify ports

  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  ports:
    - name: redfish
      port: 9814
      targetPort: 9814
      protocol: TCP
      # ingressPath: /
      ingressPathType: prefix
      # nodePort: 30080
  loadBalancerIP: "" # set to the IP you want to use for the LoadBalancer
  loadBalancerSourceRanges: [] # list of IP CIDRs allowed access to load balancer (if supported)


  # externalIPs: ["10.98.0.143"]

  ## Set the Cluster IP to use
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#choosing-your-own-ip-address
  ##
  # clusterIP: None

  annotations: {}
  
  externalTrafficPolicy: Cluster

  # Set the service SessionAffinity for session stickiness
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#proxy-mode-userspace
  sessionAffinity: ClientIP

  # Customize the SessionAntiAffinity configuration. The default value for sessionAffinityConfig.clientIP.timeoutSeconds is 10800 (3 hours)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 7200

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

#This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: exporter-config-volume
    configMap:
      name: redfish-exporter-configmap
# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: exporter-config-volume
    mountPath: /opt/redfish_exporter/templates/configs

nodeSelector: {}

tolerations: []

affinity: {}

nodeAffinityPreset:
  type: ""
  key: ""
  values: []

timezone: "Asia/Ho_Chi_Minh"

env: {}


# Config for exporter.
# Default config is in the configmap, you can override it by providing your own config in extraConfig.default
config:
  default:
    auth:
      username: ""
      password: ""
  # Define additional config sections here if using new credentials for different servers.
  # system:
  #   auth:
  #     username: ""
  #     password: ""
  #   extraMetrics:
  #   - Name: PhysicalServer_powerControlStatus
  #     Description: 'physical server power control status'
  #     Type: Gauge
  #     Label: ["ServerAddress","HostName","PowerCapacityWatts","PowerLimitWatts","AverageConsumedWatts"]
  #     Datapoint: PowerControl
  #     Result: PowerConsumedWatts
  #   - Name: PhysicalServer_temperatureValue
  #     Description: 'physical server temperature value'
  #     Type: Gauge
  #     Label: ["ServerAddress","HostName","Name"]
  #     Datapoint: Temperature
  #     Result: ReadingCelsius