{{- $g := .Values.global }}
{{- $csv := dig "csv-view" "enabled" false $g }}
{{- $mageai := dig "mage-ai" "enabled" false $g }}
{{- $report := dig "icinga2-report" "enabled" false $g }}
{{- $nginx := dig "ingress-nginx" "enabled" false $g }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
data:
  traefik.yaml: |-
    http:
      middlewares:
        cors:
          headers:
            frameDeny: false
            browserXssFilter: false
            stsSeconds: 15768000
            contentSecurityPolicy: "style-src 'self' 'unsafe-inline';"
            customResponseHeaders:
              Access-Control-Allow-Credentials: "true"
              Access-Control-Allow-Headers: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
              Access-Control-Allow-Methods: "GET,POST,PUT,DELETE,OPTIONS"
              Access-Control-Allow-Origin: "*"
        # dashboard-auth:
        #   basicAuth:
        #     users:
        #       - "<dummy-fill up when applying>"
        # grafana-auth:
        #   headers:
        #     customRequestHeaders:
        #       Authorization: "<dummy-fill up when applying>"

        redirect-homepage:
          redirectRegex:
            regex: '^(https?://[^/]+)/?([?].*)?$'
            replacement: "${1}/app${2}"
            permanent: true
        {{- if $csv }}
        csv-strip:
          stripPrefix:
            prefixes:
              - "/csv"
        {{- end }}
        {{- if $report }}
        icinga2-report-strip:
          stripPrefix:
            prefixes:
              - "/grafana/send_request"
        {{- end }}

      routers:
        default:
          middlewares:
            - "redirect-homepage"
          rule: "Path(`/`)"
          service: "frontend"
        default-tls:
          middlewares:
            - "redirect-homepage"
          rule: "Path(`/`)"
          service: "frontend"
          tls: {}
        backend:
          middlewares:
            - "cors"
          priority: 100
          rule: "PathPrefix(`/public`) || PathPrefix(`/api/v1`)"
          service: "backend"
        backend-tls:
          middlewares:
            - "cors"
          priority: 100
          rule: "PathPrefix(`/public`) || PathPrefix(`/api/v1`)"
          service: "backend"
          tls: {}
        dashboard:
          middlewares: []
          rule: "(PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
          service: "api@internal"
        dashboard-tls:
          middlewares: []
          rule: "PathPrefix(`/dashboard`)"
          service: "dashboard"
          tls: {}
        frontend:
          middlewares:
            - "cors"
          rule: >-
            PathPrefix(`/login`) || PathPrefix(`/logout`) ||
            PathPrefix(`/admin`) || PathPrefix(`/app`) || PathPrefix(`/build`) ||
            PathPrefix(`/api/visualizer`) || PathPrefix(`/api/datasources`) ||
            PathPrefix(`/api/metadata`) || PathPrefix(`/api/queries`) ||
            PathPrefix(`/api/templates`)
          service: "frontend"
        frontend-tls:
          middlewares:
            - "cors"
          rule: >-
            PathPrefix(`/login`) || PathPrefix(`/logout`) ||
            PathPrefix(`/admin`) || PathPrefix(`/app`) || PathPrefix(`/build`) ||
            PathPrefix(`/api/visualizer`) || PathPrefix(`/api/datasources`) ||
            PathPrefix(`/api/metadata`) || PathPrefix(`/api/queries`) ||
            PathPrefix(`/api/templates`)
          service: "frontend"
          tls: {}
        {{- if $csv }}
        csv:
          middlewares:
            - "csv-strip"
          rule: "PathPrefix(`/csv/`)"
          service: "csv-view"
        csv-tls:
          middlewares:
            - "csv-strip"
          rule: "PathPrefix(`/csv/`)"
          service: "csv-view"
          tls: {}
        static-csv:
          rule: "PathPrefix(`/static_csv/`)"
          service: "csv-view"
        static-csv-tls:
          rule: "PathPrefix(`/static_csv/`)"
          service: "csv-view"
          tls: {}
        {{- end }}
        {{- if $mageai }}
        mage-ai:
          rule: "PathPrefix(`/mageai`)"
          service: "mage-ai"
        mage-ai-tls:
          rule: "PathPrefix(`/mageai`)"
          service: "mage-ai"
          tls: {}
        {{- end }}
        {{- if $report }}
        icinga2-report:
          middlewares:
            - "icinga2-report-strip"
          rule: "PathPrefix(`/grafana/send_request/`)"
          service: "icinga2-report"
        icinga2-report-tls:
          middlewares:
            - "icinga2-report-strip"
          rule: "PathPrefix(`/grafana/send_request/`)"
          service: "icinga2-report"
          tls: {}
        {{- end }}
        {{- if $nginx }}
        ingress-nginx:
          priority: 1
          rule: "PathPrefix(`/`)"
          service: "ingress-nginx"
        ingress-nginx-tls:
          priority: 1
          rule: "PathPrefix(`/`)"
          service: "ingress-nginx"
          tls: {}
        report-grafana-redirect:
          rule: "PathPrefix(`/grafana-redirect-report-nmaa`)"
          service: "ingress-nginx"
        report-grafana-redirect-tls:
          rule: "PathPrefix(`/grafana-redirect-report-nmaa`)"
          service: "ingress-nginx"
          tls: {}
        {{- end }}

      #   icingaweb:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/icingaweb`)"
      #     service: "icingaweb"
      #   icingaweb-tls:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/icingaweb`)"
      #     service: "icingaweb"
      #     tls: {}
      #   grafana:
      #     middlewares:
      #       - "cors"
      #       # - "grafana-auth"
      #     rule: "PathPrefix(`/grafana`)"
      #     service: "grafana"
      #   grafana-tls:
      #     middlewares:
      #       - "cors"
      #       # - "grafana-auth"
      #     rule: "PathPrefix(`/grafana`)"
      #     service: "grafana"
      #     tls: {}
      #   rundeck:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/rundeck`)"
      #     service: "rundeck"
      #   rundeck-tls:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/rundeck`)"
      #     service: "rundeck"
      #     tls: {}
      #   topology:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/topology`)"
      #     service: "topology"
      #   topology-tls:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/topology`)"
      #     service: "topology"
      #     tls: {}
      #   gitlist:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/gitlist`)"
      #     service: "gitlist"
      #   gitlist-tls:
      #     middlewares:
      #       - "cors"
      #     rule: "PathPrefix(`/gitlist`)"
      #     service: "gitlist"
      #     tls: {}

      serversTransports:
        localssl:
          insecureSkipVerify: true

      services:
        backend:
          loadBalancer:
            servers:
              - url: "http://topology-app"
        frontend:
          loadBalancer:
            servers:
              - url: "http://topology-web"
        {{- if $csv }}
        csv-view:
          loadBalancer:
            servers:
              - url: "http://csv-view:8000"
        {{- end }}
        {{- if $mageai }}
        mage-ai:
          loadBalancer:
            servers:
              - url: "http://mage-ai:6789"
        {{- end }}
        {{- if $report }}
        icinga2-report:
          loadBalancer:
            servers:
              - url: "http://icinga2-report:8888"
        {{- end }}
        {{- if $nginx }}
        ingress-nginx:
          loadBalancer:
            servers:
              - url: "http://{{ .Release.Name }}-ingress-frontend:80"
        {{- end }}
      #   icingaweb:
      #     loadBalancer:
      #       servers:
      #         - url: "http://icingaweb:8080/icingaweb/"
      #   grafana:
      #     loadBalancer:
      #       servers:
      #         - url: "http://grafana:3000/grafana/"
      #   rundeck:
      #     loadBalancer:
      #       servers:
      #         - url: "http://rundeck:4440/rundeck"
      #   topology:
      #     loadBalancer:
      #       servers:
      #         - url: "http://nagvis:80/nagvis/"
      #   gitlist:
      #     loadBalancer:
      #       servers:
      #         - url: "http://gitlist:80/gitlist/"
      #   csv:
      #     loadBalancer:
      #       servers:
      #         - url: "http://proxy:80/csv/"
      #   static_csv:
      #     loadBalancer:
      #       servers:
      #         - url: "http://proxy:80/static_csv/"

    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /tls/tls.crt
            keyFile: /tls/tls.key
      certificates:
        - certFile: /tls/tls.crt
          keyFile: /tls/tls.key
