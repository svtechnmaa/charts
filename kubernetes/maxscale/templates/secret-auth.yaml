{{- if hasKey .Values "auth" }}
{{- fail "Move auth to maxscaleConfig.auth" }}
{{- end }}
{{- if not .Values.maxscaleConfig.auth.existingSecret }}
{{- $context := merge (dict "Values" (deepCopy .Values)) . }}
{{- $_ := set $context.Values.maxscaleConfig.auth "password" (tpl (default "" .Values.maxscaleConfig.auth.password | toString) .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maxscale.authSecretName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: maxscale-auth
type: Opaque
data:
  {{ include "maxscale.authSecretKey" . | quote }}: {{ include "common.secrets.passwords.manage" (dict "secret" (include "maxscale.authSecretName" .) "key" (include "maxscale.authSecretKey" .) "providedValues" (list "maxscaleConfig.auth.password") "length" 32 "context" $context) }}
{{- end }}
