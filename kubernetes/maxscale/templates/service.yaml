apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector:
    app.kubernetes.io/component: maxscale
  ports:
    {{- range .Values.routers }}
    - name: {{ .id | lower | replace "_" "-" | trunc 15 | trimSuffix "-" }}
      protocol: TCP
      port: {{ .servicePort }}
      targetPort: {{ .port }}
    {{- end }}
  {{- if .Values.global.externalIP }}
  externalIPs:
  - {{ .Values.global.externalIP }}
  {{- end }}
  type: ClusterIP
