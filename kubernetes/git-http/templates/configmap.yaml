{{- $safeDirectory := default (printf "%s/*" (trimSuffix "/" .Values.apache.repositoryRoot)) .Values.apache.safeDirectory -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: git-http
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    ServerName {{ .Values.apache.serverName | quote }}
    Listen {{ .Values.service.port }}
    PidFile /tmp/httpd.pid
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule authn_core_module modules/mod_authn_core.so
    LoadModule authn_file_module modules/mod_authn_file.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule authz_user_module modules/mod_authz_user.so
    LoadModule auth_basic_module modules/mod_auth_basic.so
    LoadModule alias_module modules/mod_alias.so
    LoadModule env_module modules/mod_env.so
    LoadModule setenvif_module modules/mod_setenvif.so
    LoadModule cgid_module modules/mod_cgid.so
    LoadModule log_config_module modules/mod_log_config.so
    ScriptSock /tmp/cgisock
    ErrorLog /proc/self/fd/2
    LogFormat "%h %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common

    SetEnv GIT_PROJECT_ROOT {{ .Values.apache.repositoryRoot | quote }}
    SetEnv GIT_HTTP_EXPORT_ALL
    # The repository is prepared by a separate job and can have a different
    # owner from the non-root Apache process. Pass safe.directory as protected
    # command-scope Git configuration to git-http-backend.
    SetEnv GIT_CONFIG_COUNT 1
    SetEnv GIT_CONFIG_KEY_0 safe.directory
    SetEnv GIT_CONFIG_VALUE_0 {{ $safeDirectory | quote }}
    {{- if .Values.apache.forceProtocolV2 }}
    SetEnv GIT_PROTOCOL version=2
    {{- else }}
    SetEnvIf Git-Protocol ".*" GIT_PROTOCOL=$0
    {{- end }}
    ScriptAlias /git/ /usr/lib/git-core/git-http-backend/

    <Location /git/>
        AuthType Basic
        AuthName {{ .Values.auth.realm | quote }}
        AuthUserFile /etc/git-http/auth/htpasswd
        Require valid-user
    </Location>
