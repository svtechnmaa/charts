{{- $username := include "git-http.auth.username" . -}}
{{- $password := include "git-http.auth.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-auth
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: git-http
type: Opaque
stringData:
  htpasswd: {{ htpasswd $username $password | quote }}
