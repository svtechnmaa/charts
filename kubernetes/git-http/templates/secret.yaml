{{- if not .Values.auth.existingSecret -}}
{{- $name := include "git-http.auth.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
{{- $data := default dict $existing.data -}}
{{- $username := "" -}}
{{- $password := "" -}}
{{- if hasKey $data "username" -}}
{{- $username = required "git-http-auth username is empty; repair the Secret" (index $data "username") -}}
{{- else -}}
{{- $username = include "git-http.auth.username" . | b64enc -}}
{{- end -}}
{{- if hasKey $data "password" -}}
{{- $password = required "git-http-auth password is empty; repair the Secret" (index $data "password") -}}
{{- else -}}
{{- $password = include "git-http.auth.password" . | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: git-http
type: Opaque
data:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
{{- end }}
