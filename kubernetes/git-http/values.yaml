global:
  github:
    user: ""
    fg_token: ""
  sharedVolume:
    enabled: false
  sharedPersistenceVolume: []

timezone: Asia/Ho_Chi_Minh

image:
  registry: docker.io
  repository: duchieu2920/httpd
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
updateStrategy: Recreate

commonAnnotations: {}
commonLabels: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

command:
  - /bin/sh
  - -ec
args:
  - |
    rm -f /tmp/httpd.pid /tmp/cgisock.*
    exec httpd -DFOREGROUND -f /etc/git-http/httpd.conf

auth:
  # Empty values fall back to global.adminUser/global.adminPassword.
  username: ""
  password: ""
  realm: git-server

apache:
  serverName: git.internal
  repositoryRoot: /srv/git
  # Empty trusts every repository directly below repositoryRoot. Set an exact
  # path when this server should expose only one bare repository.
  safeDirectory: ""
  forceProtocolV2: true

# Bare repositories created by the init container. Repository names must be
# direct children of apache.repositoryRoot and cannot contain '/'.
repositories:
  - grafana-entities.git

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  sessionAffinity: None

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  path: /git
  pathType: Prefix
  hosts: []
  tls: []

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -ec
      - test -S /tmp/cgisock.1
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -ec
      - test -S /tmp/cgisock.1
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits: {}
  requests: {}

affinity: {}
nodeSelector:
  kubernetes.io/hostname: nms-01
tolerations: []

# Repository storage can come from global.sharedPersistenceVolume or these
# chart-local values. The init container creates missing bare repositories,
# but repository content is seeded by a separate workflow.
volumes:
  - name: config
    configMap:
      name: '{{ .Chart.Name }}-config'
  - name: auth
    secret:
      secretName: '{{ .Chart.Name }}-auth'
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /etc/git-http/httpd.conf
    subPath: httpd.conf
    readOnly: true
  - name: auth
    mountPath: /etc/git-http/auth
    readOnly: true
  - name: tmp
    mountPath: /tmp
