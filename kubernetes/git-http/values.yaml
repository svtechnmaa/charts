global:
  github:
    user: ""
    fg_token: ""
  sharedVolume:
    enabled: true    # Enable for adding Volume/VolumeMounts to pod
  sharedPersistenceVolume:
    - volumeName: git-repository
      pvcName: git-repository-pvc
      storageSize: 2Gi
      path: /srv/git
      accessModes: ReadWriteOnce
      shareFor:
        - git-http
      # storageClass: seaweedfs-storage
      storageClass: git-repository-hostpath # for hostPath PV (need folderName for syncthing to share between nodes)
      folderName: git-repository # for syncthing


timezone: Asia/Ho_Chi_Minh

image:
  registry: docker.io
  repository: duchieu2920/httpd
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
updateStrategy: Recreate

commonAnnotations: {}
commonLabels: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

initContainerSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

command:
  - /bin/sh
  - -ec
args:
  - |
    rm -f /tmp/httpd.pid /tmp/cgisock.*
    exec httpd -DFOREGROUND -f /etc/git-http/httpd.conf

apache:
  serverName: git.internal
  repositoryRoot: /srv/git
  # Empty trusts every repository directly below repositoryRoot. Set an exact
  # path when this server should expose only one bare repository.
  safeDirectory: ""
  # Forward the client's Git-Protocol header. Do not force v2 globally because
  # git-receive-pack may advertise an empty repository using protocol v0.
  forceProtocolV2: false

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  sessionAffinity: None

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  path: /git
  pathType: Prefix
  hosts: []
  tls: []

livenessProbe:
  exec:
    command:
      - /bin/sh
      - -ec
      - test -S /tmp/cgisock.1
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - /bin/sh
      - -ec
      - test -S /tmp/cgisock.1
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits: {}
  requests: {}

affinity: {}
tolerations: []

# Repository storage can come from global.sharedPersistenceVolume or these
# chart-local values. The init container creates missing bare repositories,
# but repository content is seeded by a separate workflow.
volumes:
  - name: config
    configMap:
      name: '{{ .Chart.Name }}-config'
  - name: auth
    secret:
      secretName: '{{ .Chart.Name }}-auth'

volumeMounts:
  - name: config
    mountPath: /etc/git-http/httpd.conf
    subPath: httpd.conf
    readOnly: true
  - name: auth
    mountPath: /etc/git-http/auth
    readOnly: true

# Bare repositories created by the init container. Repository names must be
# direct children of apache.repositoryRoot and cannot contain '/'.
repositories:
  - grafana-entities.git
