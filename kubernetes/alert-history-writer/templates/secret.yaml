{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secret
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secret.data }}
  {{- /* REDIS_PASSWORD may stay empty: Redis then runs without requirepass. */}}
  {{- if and (empty $value) (ne $key "REDIS_PASSWORD") }}
  {{- fail (printf "secret.data.%s is required: set it, or set secret.create=false and provide the Secret yourself" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
{{- end }}
{{- end }}
