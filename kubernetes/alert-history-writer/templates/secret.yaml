{{- if .Values.secret.create }}
{{- /* Keys that must be set. REDIS_PASSWORD only while the bundled Redis runs
(it becomes requirepass); with an external Redis it is optional. */}}
{{- $required := list "ALERTMANAGER_API_KEYS" "MYSQL_USER" "MYSQL_PASSWORD" }}
{{- if .Values.redis.enabled }}
{{- $required = append $required "REDIS_PASSWORD" }}
{{- end }}
{{- range $key := $required }}
{{- if empty (index $.Values.secret.data $key) }}
{{- fail (printf "secret.data.%s is required: set it, or set secret.create=false and provide the Secret yourself" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-secret
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secret.data }}
  {{- /* Empty optional keys are skipped rather than stored as empty strings. */}}
  {{- if not (empty $value) }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
