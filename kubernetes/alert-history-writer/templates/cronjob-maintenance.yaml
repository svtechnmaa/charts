{{- $component := "maintenance" }}
{{- $values := .Values.maintenance }}
{{- $timezone := include "common.timezone" ( dict "timezone" .Values.timezone "global" .Values.global ) }}
{{- if $values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "common.names.fullname" . }}-{{ $component }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $values.schedule | quote }}
  # Same value as config.TIMEZONE: this decides when the Job starts,
  # TIMEZONE decides the local-date partition boundaries.
  timeZone: {{ $timezone | quote }}
  concurrencyPolicy: {{ $values.concurrencyPolicy }}
  startingDeadlineSeconds: {{ $values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $values.backoffLimit }}
      activeDeadlineSeconds: {{ $values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "common.labels.standard" . | nindent 12 }}
            app.kubernetes.io/component: {{ $component }}
        spec:
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr-pull-secret
          {{- if .Values.serviceAccount.create }}
          serviceAccountName: {{ .Values.serviceAccount.name | default (include "common.names.fullname" .) }}
          {{- end }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
          {{- with $values.terminationGracePeriodSeconds }}
          terminationGracePeriodSeconds: {{ . }}
          {{- end }}
          {{- if .Values.podSecurityContext }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- end }}
          # Affinity and nodeSelector are mutually exclusive. If you set one, the other will be ignored.
          {{- with .Values.affinity }}
          affinity: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- else }}
          affinity:
            podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "context" $) | nindent 14 }}
            podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "context" $) | nindent 14 }}
            nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 14 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $values.initContainers }}
          initContainers:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $component }}
              {{- if .Values.securityContext }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              {{- end }}
              image: {{ include "common.images.image" ( dict "imageRoot" .Values.image "global" .Values.global ) }}
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
              {{- with $values.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $values.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: TZ
                  value: {{ default $timezone | quote }}
                {{- range $key, $value := (merge (dict) ($values.env | default dict) .Values.env) }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              {{- with .Values.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              # Resources required by the container. More information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
              resources:
                {{- toYaml $values.resources | nindent 16 }}
              volumeMounts:
                # shareVolume: VolumeMount
                {{- if and .Values.global .Values.global.sharedPersistenceVolume .Values.global.sharedVolume }}
                {{- range .Values.global.sharedPersistenceVolume }}
                {{- if has $.Chart.Name .shareFor }}
                - name: {{ .volumeName }}
                  mountPath: {{ .path }}
                {{- end }}
                {{- end }}
                {{- end }}
                # unshareVolume(volumeMount): define in the chart's values.yaml
                {{- if .Values.volumeMounts }}
                {{- toYaml .Values.volumeMounts | nindent 16 }}
                {{- end }}
          volumes:
          # shareVolume(volume): define in the global values
            {{- if and .Values.global .Values.global.sharedPersistenceVolume .Values.global.sharedVolume }}
            {{- range .Values.global.sharedPersistenceVolume }}
            {{- if has $.Chart.Name .shareFor }}
            - name: {{ .volumeName }}
              persistentVolumeClaim:
                claimName: {{ .pvcName }}
            {{- end }}
            {{- end }}
            {{- end }}
          # unshareVolume(volume): define in the chart's values.yaml
            {{- if .Values.volumes }}
            {{- toYaml .Values.volumes | nindent 12 }}
            {{- end }}
{{- end }}
