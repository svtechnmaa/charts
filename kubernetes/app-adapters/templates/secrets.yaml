{{- $components := list -}}
{{- if .Values.adapters.grafana.enabled -}}
{{- $fields := list "managementToken" -}}
{{- if not .Values.adapters.grafana.nativeAuth.existingSecret -}}
{{- $fields = append $fields "nativeCredentials" -}}
{{- end -}}
{{- $components = append $components (dict "name" "grafana" "auth" .Values.adapters.grafana.auth "fields" $fields) -}}
{{- end -}}
{{- if .Values.adapters.rundeck.enabled -}}
{{- $components = append $components (dict "name" "rundeck" "auth" .Values.adapters.rundeck.auth "fields" (list "nativeToken" "managementToken" "bindingKey" "clientSecret" "cookieSecret")) -}}
{{- end -}}
{{- range $component := $components -}}
{{- $auth := $component.auth -}}
{{- if not $auth.existingSecret -}}
{{- $name := include "app-adapters.secretName" (dict "auth" $auth "component" $component.name "context" $) -}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name | default dict -}}
{{- $data := default dict $existing.data -}}
{{- $result := dict -}}
{{- range $field := $component.fields -}}
{{- $key := include "app-adapters.secretKey" (dict "auth" $auth "field" $field "context" $) -}}
{{- if hasKey $result $key -}}
{{- fail (printf "%s.auth.secretKeys must use distinct keys" $component.name) -}}
{{- end -}}
{{- $value := "" -}}
{{- if hasKey $data $key -}}
{{- $value = required (printf "Managed Secret %s key %s is empty; repair it before upgrading" $name $key) (index $data $key) -}}
{{- else -}}
{{- $provided := tpl (default "" (index $auth $field) | toString) $ -}}
{{- $provided = required (printf "%s.auth.%s or %s.auth.existingSecret is required; provision the matching external credential first" $component.name $field $component.name) $provided -}}
{{- if and (eq $component.name "rundeck") (eq $field "cookieSecret") -}}
{{- $raw := $provided | b64dec -}}
{{- if or (ne (len $raw) 32) (ne ($raw | b64enc) $provided) -}}
{{- fail "adapters.rundeck.auth.cookieSecret must be canonical Base64 of exactly 32 random binary bytes" -}}
{{- end -}}
{{- $value = $provided -}}
{{- else -}}
{{- if and (eq $component.name "rundeck") (eq $field "bindingKey") (lt (len $provided) 32) -}}
{{- fail "adapters.rundeck.auth.bindingKey must contain at least 32 bytes" -}}
{{- end -}}
{{- $value = $provided | b64enc -}}
{{- end -}}
{{- end -}}
{{- $_ := set $result $key $value -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
type: Opaque
data:
  {{- toYaml $result | nindent 2 }}
{{ end -}}
{{- end -}}
